          package com.carlosart.cerberus

          import android.accessibilityservice.AccessibilityService
          import android.content.Intent
          import android.os.Bundle
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo

          class CerberusAccess : AccessibilityService() {

              companion object {
                  @Volatile var inst: CerberusAccess? = null
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  inst = this
              }

              override fun onUnbind(intent: Intent?): Boolean {
                  inst = null
                  return super.onUnbind(intent)
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              fun global(action: Int): Boolean = performGlobalAction(action)

              private fun walk(n: AccessibilityNodeInfo?, out: MutableList<AccessibilityNodeInfo>) {
                  if (n == null) return
                  out.add(n)
                  for (i in 0 until n.childCount) walk(n.getChild(i), out)
              }

              private fun label(n: AccessibilityNodeInfo): String =
                  Actions.norm((n.text ?: n.contentDescription ?: "").toString())

              fun clickText(q: String): Boolean {
                  val root = rootInActiveWindow ?: return false
                  val all = ArrayList<AccessibilityNodeInfo>()
                  walk(root, all)
                  val nq = Actions.norm(q)
                  if (nq.isEmpty()) return false
                  val hit = all.firstOrNull { label(it) == nq }
                      ?: all.firstOrNull { label(it).isNotEmpty() && label(it).contains(nq) }
                      ?: return false
                  var n: AccessibilityNodeInfo? = hit
                  while (n != null && !n.isClickable) n = n.parent
                  return (n ?: hit).performAction(AccessibilityNodeInfo.ACTION_CLICK)
              }

              fun clickId(id: String): Boolean {
                  val root = rootInActiveWindow ?: return false
                  val l = root.findAccessibilityNodeInfosByViewId(id)
                  val n = l?.firstOrNull() ?: return false
                  return n.performAction(AccessibilityNodeInfo.ACTION_CLICK)
              }

              fun typeText(t: String): Boolean {
                  val root = rootInActiveWindow ?: return false
                  val f = root.findFocus(AccessibilityNodeInfo.FOCUS_INPUT) ?: return false
                  val args = Bundle()
                  val old = f.text?.toString() ?: ""
                  args.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, old + t)
                  return f.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args)
              }

              fun scroll(forward: Boolean): Boolean {
                  val root = rootInActiveWindow ?: return false
                  val all = ArrayList<AccessibilityNodeInfo>()
                  walk(root, all)
                  val s = all.firstOrNull { it.isScrollable } ?: return false
                  return s.performAction(
                      if (forward) AccessibilityNodeInfo.ACTION_SCROLL_FORWARD else AccessibilityNodeInfo.ACTION_SCROLL_BACKWARD
                  )
              }

              fun readScreen(): String {
                  val root = rootInActiveWindow ?: return "No puedo ver la pantalla, señor."
                  val all = ArrayList<AccessibilityNodeInfo>()
                  walk(root, all)
                  val texts = all.mapNotNull { (it.text ?: it.contentDescription)?.toString()?.trim() }
                      .filter { it.isNotEmpty() }
                      .distinct()
                  if (texts.isEmpty()) return "No veo texto en la pantalla, señor."
                  return texts.joinToString(". ").take(450)
              }
          }
