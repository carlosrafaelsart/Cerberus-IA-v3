          package com.carlosart.cerberus

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import android.telephony.TelephonyManager
          import java.util.Locale
          import java.util.concurrent.Executors

          class CerberusService : Service(), TextToSpeech.OnInitListener {

              private var tts: TextToSpeech? = null
              private var ttsReady = false
              private var rec: SpeechRecognizer? = null
              private val main = Handler(Looper.getMainLooper())
              private val io = Executors.newSingleThreadExecutor()
              private lateinit var actions: Actions
              private lateinit var brain: Brain
              private var speaking = false
              private var stopped = false
              private var awakeUntil = 0L

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  actions = Actions(this)
                  brain = Brain(this)
                  startAsForeground()
                  tts = TextToSpeech(this, this)
                  val f = IntentFilter(TelephonyManager.ACTION_PHONE_STATE_CHANGED)
                  if (Build.VERSION.SDK_INT >= 33) registerReceiver(phoneRx, f, Context.RECEIVER_EXPORTED)
                  else registerReceiver(phoneRx, f)
                  Bus.running = true
                  Bus.emit("idle", "Cerberus en línea.")
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int = START_STICKY

              private fun startAsForeground() {
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  if (Build.VERSION.SDK_INT >= 26) {
                      nm.createNotificationChannel(NotificationChannel("cerberus", "Cerberus", NotificationManager.IMPORTANCE_LOW))
                  }
                  val open = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val n = Notification.Builder(this, "cerberus")
                      .setContentTitle("Cerberus a su servicio, señor")
                      .setContentText("Diga \"Cerberus\" seguido de una orden")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setContentIntent(open)
                      .setOngoing(true)
                      .build()
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)
                  } else {
                      startForeground(1, n)
                  }
              }

              override fun onInit(status: Int) {
                  val t = tts ?: return
                  t.language = Locale("es", "MX")
                  t.setSpeechRate(0.98f)
                  t.setPitch(0.85f)
                  t.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                      override fun onStart(id: String?) { Bus.kick() }
                      override fun onRangeStart(utteranceId: String?, start: Int, end: Int, frame: Int) { Bus.kick() }
                      override fun onDone(id: String?) { afterSpeech() }
                      @Deprecated("Deprecated in Java")
                      override fun onError(id: String?) { afterSpeech() }
                  })
                  ttsReady = status == TextToSpeech.SUCCESS
                  say("Cerberus en línea. A sus órdenes, señor.")
              }

              private fun afterSpeech() {
                  main.post {
                      speaking = false
                      Bus.level = 0f
                      awakeUntil = maxOf(awakeUntil, System.currentTimeMillis() + 6000)
                      Bus.emit("idle", "")
                      listen()
                  }
              }

              private fun say(text: String) {
                  val t = tts
                  if (!ttsReady || t == null) { Bus.emit("idle", text); listen(); return }
                  speaking = true
                  rec?.cancel()
                  Bus.emit("speaking", text)
                  t.speak(text, TextToSpeech.QUEUE_FLUSH, null, "cerberus")
              }

              private fun listen() {
                  if (stopped) return
                  main.post {
                      if (stopped || speaking) return@post
                      if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                          Bus.emit("idle", "Reconocimiento de voz no disponible en este teléfono.")
                          return@post
                      }
                      rec?.destroy()
                      val r = SpeechRecognizer.createSpeechRecognizer(this)
                      r.setRecognitionListener(listener)
                      rec = r
                      val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                          .putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                          .putExtra(RecognizerIntent.EXTRA_LANGUAGE, "es-ES")
                          .putExtra(RecognizerIntent.EXTRA_CALLING_PACKAGE, packageName)
                      r.startListening(i)
                      val awake = System.currentTimeMillis() < awakeUntil
                      Bus.emit("listening", if (awake) "Escuchando…" else "Diga \"Cerberus\"…")
                  }
              }

              private val listener = object : RecognitionListener {
                  override fun onReadyForSpeech(params: Bundle?) {}
                  override fun onBeginningOfSpeech() {}
                  override fun onRmsChanged(rmsdB: Float) { Bus.level = ((rmsdB + 2f) / 12f).coerceIn(0f, 1f) }
                  override fun onBufferReceived(buffer: ByteArray?) {}
                  override fun onEndOfSpeech() {}
                  override fun onPartialResults(partialResults: Bundle?) {}
                  override fun onEvent(eventType: Int, params: Bundle?) {}

                  override fun onError(error: Int) {
                      if (stopped || speaking) return
                      when (error) {
                          SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS -> {
                              Bus.emit("idle", "Falta el permiso de micrófono, señor.")
                          }
                          SpeechRecognizer.ERROR_RECOGNIZER_BUSY -> main.postDelayed({ listen() }, 1200)
                          else -> main.postDelayed({ listen() }, 250)
                      }
                  }

                  override fun onResults(results: Bundle?) {
                      val text = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()
                      if (text.isNullOrBlank()) { listen(); return }
                      handle(text)
                  }
              }

              private fun handle(text: String) {
                  val low = text.lowercase(Locale.ROOT)
                  val m = Regex("cerberus|cerbero|cerveros?|cerberos|servers").find(low)
                  val now = System.currentTimeMillis()
                  when {
                      m != null -> {
                          val cmd = low.substring(m.range.last + 1).trim(' ', ',', '.', ':')
                          if (cmd.isEmpty()) {
                              awakeUntil = now + 8000
                              say("A sus órdenes, señor.")
                          } else execute(cmd)
                      }
                      now < awakeUntil -> execute(low)
                      else -> listen()
                  }
              }

              private fun execute(cmd: String) {
                  awakeUntil = 0L
                  Bus.emit("thinking", cmd)
                  io.execute {
                      val ans = actions.tryHandle(cmd) ?: brain.ask(cmd)
                      main.post { say(ans) }
                  }
              }

              private val phoneRx = object : BroadcastReceiver() {
                  override fun onReceive(c: Context, i: Intent) {
                      if (i.getStringExtra(TelephonyManager.EXTRA_STATE) != TelephonyManager.EXTRA_STATE_RINGING) return
                      val num = i.getStringExtra(TelephonyManager.EXTRA_INCOMING_NUMBER)
                      val who = if (num.isNullOrEmpty()) null else actions.contactName(num)
                      awakeUntil = System.currentTimeMillis() + 20000
                      say("Señor, entra una llamada" + (if (who != null) " de $who" else "") + ". ¿La contesto?")
                  }
              }

              override fun onDestroy() {
                  stopped = true
                  Bus.running = false
                  try { unregisterReceiver(phoneRx) } catch (e: Exception) {}
                  rec?.destroy()
                  tts?.shutdown()
                  io.shutdownNow()
                  Bus.emit("idle", "Cerberus desactivado.")
                  super.onDestroy()
              }
          }
