                  "video" -> "Generar Video"
                  "info" -> "Información en Tiempo Real"
                  else -> "Nuevo Chat"
              }

              private fun intro(): String = when (mode) {
                  "code" -> "Modo código. Dígame qué programa, script o función necesita y en qué lenguaje, señor."
                  "tiktok" -> "Crear TikTok. Dígame el tema y le preparo el guion por escenas, el texto en pantalla, la descripción y los hashtags."
                  "image" -> "Generar imagen. Cuénteme su idea y le escribo el prompt perfecto. La creación directa de imágenes llega en la próxima actualización."
                  "video" -> "Generar video. Cuénteme su idea y le preparo el guion por escenas y los prompts. La creación directa de video llega más adelante."
                  "info" -> "Información en tiempo real. Pregúnteme por clima, noticias, precios, deportes o lo que necesite: busco en internet."
                  else -> "Hola, señor 👋 ¿En qué puedo ayudarle?"
              }

              private fun bubble(text: String, user: Boolean): TextView {
                  val tv = TextView(this)
                  tv.text = text
                  tv.textSize = if (mode == "code" && !user) 13f else 15f
                  if (mode == "code" && !user) tv.typeface = Typeface.MONOSPACE
                  tv.setTextColor(Neon.TEXT)
                  tv.setTextIsSelectable(true)
                  tv.setPadding(dp(14), dp(10), dp(14), dp(10))
                  val g = GradientDrawable()
                  g.cornerRadius = dpf(14f)
                  g.setColor(if (user) 0xFF0B3A57.toInt() else Neon.PANEL)
                  g.setStroke(dp(1), if (user) Neon.CYAN else 0xFF1C3347.toInt())
                  tv.background = g
                  val row = LinearLayout(this)
                  row.gravity = if (user) Gravity.END else Gravity.START
                  val lp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                  val maxW = (resources.displayMetrics.widthPixels * 0.86f).toInt()
                  tv.maxWidth = maxW
                  row.addView(tv, lp)
                  val rlp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                  rlp.topMargin = dp(8)
                  list.addView(row, rlp)
                  scroll.post { scroll.fullScroll(View.FOCUS_DOWN) }
                  return tv
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Neon.BG
                  window.navigationBarColor = Neon.BG
                  mode = intent.getStringExtra("mode") ?: "chat"
                  if (intent.getBooleanExtra("new", false)) Store.newConversation(this)

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setBackgroundColor(Neon.BG)
                  root.setPadding(dp(12), dp(4), dp(12), dp(10))

                  val top = LinearLayout(this)
                  top.gravity = Gravity.CENTER_VERTICAL
                  val back = IconView(this, "back")
                  back.setOnClickListener { finish() }
                  top.addView(back, LinearLayout.LayoutParams(dp(44), dp(44)))
                  val tt = TextView(this)
                  tt.text = title()
                  tt.textSize = 18f
                  tt.typeface = Typeface.DEFAULT_BOLD
                  tt.setTextColor(Neon.TEXT)
                  tt.setPadding(dp(6), 0, 0, 0)
                  top.addView(tt, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  root.addView(top, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT))

                  scroll = ScrollView(this)
                  list = LinearLayout(this)
                  list.orientation = LinearLayout.VERTICAL
                  list.setPadding(0, 0, 0, dp(8))
                  scroll.addView(list)
                  root.addView(scroll, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f))

                  chip = TextView(this)
                  chip.textSize = 12f
                  chip.setTextColor(Neon.CYAN)
                  chip.setPadding(dp(8), dp(4), dp(8), dp(4))
                  chip.visibility = View.GONE
                  chip.setOnClickListener {
                      pending = null
                      chip.visibility = View.GONE
                  }
                  root.addView(chip)

                  val bar = LinearLayout(this)
                  bar.gravity = Gravity.CENTER_VERTICAL
                  val plus = IconView(this, "clip")
                  plus.background = ChamferBg(Neon.PANEL, Neon.CYAN, dpf(8f), dpf(1.2f))
                  plus.setOnClickListener { showPlusMenu() }
                  bar.addView(plus, LinearLayout.LayoutParams(dp(46), dp(46)))

                  input = EditText(this)
                  input.hint = "Escriba aquí…"
                  input.setHintTextColor(0xFF5C7A90.toInt())
                  input.setTextColor(Neon.TEXT)
                  input.textSize = 15f
                  input.maxLines = 4
                  input.imeOptions = EditorInfo.IME_ACTION_SEND
                  input.setHorizontallyScrolling(false)
                  input.inputType = android.text.InputType.TYPE_CLASS_TEXT or android.text.InputType.TYPE_TEXT_FLAG_MULTI_LINE or
                      android.text.InputType.TYPE_TEXT_FLAG_CAP_SENTENCES
                  input.background = ChamferBg(Neon.PANEL, 0xFF1C5A78.toInt(), dpf(8f), dpf(1.2f))
                  input.setPadding(dp(18), dp(8), dp(18), dp(8))
                  input.setOnEditorActionListener { _, id, _ ->
                      if (id == EditorInfo.IME_ACTION_SEND) { send(); true } else false
                  }
                  val ilp = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  ilp.leftMargin = dp(8)
                  ilp.rightMargin = dp(8)
                  bar.addView(input, ilp)

                  val sendBtn = IconView(this, "send", 0xFF04131D.toInt())
                  val sg = GradientDrawable()
                  sg.shape = GradientDrawable.OVAL
                  sg.setColor(Neon.CYAN)
                  sendBtn.background = sg
                  sendBtn.setOnClickListener { send() }
                  bar.addView(sendBtn, LinearLayout.LayoutParams(dp(46), dp(46)))
                  root.addView(bar, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT))

                  setContentView(root)
                  window.setSoftInputMode(android.view.WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE)

                  bubble(intro(), false)
                  if (intent.getBooleanExtra("files", false)) showPlusMenu()
              }

              private fun send() {
                  val q = input.text.toString().trim()
                  val att = pending
                  if (q.isEmpty() && att == null) return
                  val text = q.ifEmpty { "Analiza esto y dime qué contiene." }
                  input.setText("")
                  pending = null
                  chip.visibility = View.GONE
                  bubble((if (att != null) "📎 " + att.name + "\n" else "") + text, true)
                  val wait = bubble("Pensando…", false)
                  val app = applicationContext
                  val m = mode
                  Thread {
                      var ans: String? = null
                      if (m == "chat" && att == null) ans = Actions(app).tryHandle(text)
                      if (ans == null) ans = Brain(app).ask(text, att, m)
                      var out: String = ans
                      if (m == "code") out = out.replace(Regex("```[a-zA-Z0-9+#-]*\\n?"), "").trim()
                      runOnUiThread { wait.text = out }
                  }.start()
              }

              // ---------- adjuntos ----------

              private fun showPlusMenu() {
                  AlertDialog.Builder(this)
                      .setItems(arrayOf("Foto de la galería", "Tomar foto con la cámara", "Archivo (PDF, texto…)")) { _, which ->
                          when (which) {
                              0 -> pick("image/*", 11)
                              1 -> camera()
                              else -> pick("*/*", 12)
                          }
                      }
                      .show()
              }

              private fun pick(mime: String, code: Int) {
                  val i = Intent(Intent.ACTION_GET_CONTENT)
                  i.type = mime
                  i.addCategory(Intent.CATEGORY_OPENABLE)
                  startActivityForResult(i, code)
              }

              private fun camera() {
                  try {
                      val v = ContentValues()
                      v.put(MediaStore.Images.Media.DISPLAY_NAME, "cerberus_" + System.currentTimeMillis() + ".jpg")
                      v.put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg")
                      if (Build.VERSION.SDK_INT >= 29) v.put(MediaStore.Images.Media.RELATIVE_PATH, "Pictures/Cerberus")
                      camUri = contentResolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, v)
                      val i = Intent(MediaStore.ACTION_IMAGE_CAPTURE)
                      i.putExtra(MediaStore.EXTRA_OUTPUT, camUri)
                      startActivityForResult(i, 13)
                  } catch (e: Exception) {
                      bubble("No pude abrir la cámara, señor.", false)
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (resultCode != RESULT_OK) return
                  val uri = if (requestCode == 13) camUri else data?.data
                  if (uri == null) return
                  chip.text = "Leyendo el archivo…"
                  chip.visibility = View.VISIBLE
                  Thread {
                      val a = Attach.fromUri(this, uri)
                      runOnUiThread {
                          if (a == null) {
                              chip.text = "No pude leer ese archivo, señor."
                          } else {
                              pending = a
                              chip.text = "📎 " + a.name + "  ✕ (toque para quitar)"
                          }
                      }
                  }.start()
              }
          }
