                  val send = IconView(this, "send")
                  send.contentDescription = "Enviar"
                  send.setOnClickListener { sendText() }
                  bar.addView(send, LinearLayout.LayoutParams(dp(44), dp(44)))
                  val blp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                  blp.setMargins(dp(4), dp(2), dp(4), 0)
                  root.addView(bar, blp)

