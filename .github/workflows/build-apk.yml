          class MainActivity : Activity() {

              private lateinit var neural: NeuralView
              private lateinit var status: TextView
              private lateinit var brainLine: TextView
              private lateinit var toggle: Button
              private var camUri: Uri? = null

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun link(text: String, onClick: () -> Unit): TextView {
                  val t = TextView(this)
                  t.text = text
                  t.textSize = 16f
                  t.setTextColor(0xFF2EC4FF.toInt())
                  t.setPadding(dp(12), dp(12), dp(12), dp(12))
                  t.setOnClickListener { onClick() }
                  return t
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = 0xFF050A14.toInt()
                  window.navigationBarColor = 0xFF050A14.toInt()

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setBackgroundColor(0xFF050A14.toInt())
                  root.setPadding(dp(20), dp(8), dp(20), dp(24))

                  val top = LinearLayout(this)
                  top.orientation = LinearLayout.HORIZONTAL
                  top.addView(link("Historial") { startActivity(Intent(this, HistoryActivity::class.java)) })
                  top.addView(View(this), LinearLayout.LayoutParams(0, 1, 1f))
                  top.addView(link("⚙  Ajustes") { startActivity(Intent(this, SettingsActivity::class.java)) })
                  root.addView(top, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT))

                  neural = NeuralView(this)
                  root.addView(neural, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(260)))

                  val title = TextView(this)
                  title.text = "CERBERUS"
                  title.textSize = 30f
                  title.letterSpacing = 0.35f
                  title.typeface = Typeface.DEFAULT_BOLD
                  title.setTextColor(0xFFE8F6FF.toInt())
                  title.gravity = Gravity.CENTER
                  title.setPadding(0, dp(12), 0, 0)
                  root.addView(title)

                  val sub = TextView(this)
                  sub.text = "ASISTENTE PERSONAL CON IA · CREADO POR CARLOSART"
                  sub.textSize = 10f
                  sub.letterSpacing = 0.15f
                  sub.setTextColor(0xFF2EC4FF.toInt())
                  sub.gravity = Gravity.CENTER
                  root.addView(sub)

                  brainLine = TextView(this)
                  brainLine.textSize = 12f
                  brainLine.setTextColor(0xFF5C7A90.toInt())
                  brainLine.gravity = Gravity.CENTER
                  brainLine.setPadding(0, dp(6), 0, 0)
                  root.addView(brainLine)

                  status = TextView(this)
                  status.text = "A sus órdenes, señor."
                  status.textSize = 17f
                  status.setTextColor(0xFFB8CCDA.toInt())
                  status.gravity = Gravity.CENTER
                  status.setPadding(dp(8), dp(8), dp(8), dp(8))
                  root.addView(status, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f))

                  val bottom = LinearLayout(this)
                  bottom.orientation = LinearLayout.HORIZONTAL

                  val plus = Button(this)
                  plus.text = "+"
                  plus.textSize = 28f
                  plus.setTextColor(0xFF2EC4FF.toInt())
                  plus.setBackgroundColor(0xFF0E2A3F.toInt())
                  plus.setOnClickListener { showPlusMenu() }
                  bottom.addView(plus, LinearLayout.LayoutParams(dp(64), dp(60)))

                  toggle = Button(this)
                  toggle.setTextColor(0xFFE8F6FF.toInt())
                  toggle.setBackgroundColor(0xFF0E2A3F.toInt())
                  toggle.textSize = 17f
                  toggle.setOnClickListener { toggleService() }
                  val tlp = LinearLayout.LayoutParams(0, dp(60), 1f)
                  tlp.leftMargin = dp(10)
                  bottom.addView(toggle, tlp)

                  root.addView(bottom, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT))

                  setContentView(root)
              }

              override fun onResume() {
                  super.onResume()
                  Bus.listener = { state, text ->
                      neural.state = state
                      if (text.isNotEmpty()) status.text = text
                  }
                  val prov = Cfg.provider(this)
                  brainLine.text = "Cerebro: " + Cfg.name(prov) + " · " + Cfg.model(this, prov).ifEmpty { "sin modelo" }
                  if (Cfg.key(this, prov).isEmpty() && !Bus.running) {
                      status.text = "Toque Ajustes y configure su clave, señor."
                  }
                  neural.state = if (Bus.running) "listening" else "idle"
                  refreshButton()
              }

              override fun onPause() {
                  Bus.listener = null
                  super.onPause()
              }

              private fun refreshButton() {
                  toggle.text = if (Bus.running) "Desactivar Cerberus" else "Activar Cerberus"
              }

              private fun hasMic() =
                  checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED

              private fun toggleService() {
                  if (Bus.running) {
                      stopService(Intent(this, CerberusService::class.java))
                      Bus.running = false
                      neural.state = "idle"
                      status.text = "Cerberus desactivado."
                  } else {
                      if (!hasMic()) {
                          status.text = "Necesito permisos, señor. Acéptelos o use Ajustes."
                          askPermissions()
                          return
                      }
                      startForegroundService(Intent(this, CerberusService::class.java))
                      Bus.running = true
                  }
                  refreshButton()
              }

              // ---------- botón + : fotos, cámara y archivos ----------

              private fun showPlusMenu() {
                  AlertDialog.Builder(this)
                      .setItems(arrayOf("Foto de la galería", "Tomar foto con la cámara", "Archivo (PDF, texto…)")) { _, which ->
                          when (which) {
                              0 -> pick("image/*", 11)
                              1 -> camera()
                              else -> pick("*/*", 12)
                          }
                      }
                      .show()
              }

              private fun pick(mime: String, code: Int) {
                  val i = Intent(Intent.ACTION_GET_CONTENT)
                  i.type = mime
                  i.addCategory(Intent.CATEGORY_OPENABLE)
                  startActivityForResult(i, code)
              }

              private fun camera() {
                  try {
                      val v = ContentValues()
                      v.put(MediaStore.Images.Media.DISPLAY_NAME, "cerberus_" + System.currentTimeMillis() + ".jpg")
                      v.put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg")
                      if (Build.VERSION.SDK_INT >= 29) v.put(MediaStore.Images.Media.RELATIVE_PATH, "Pictures/Cerberus")
                      camUri = contentResolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, v)
                      val i = Intent(MediaStore.ACTION_IMAGE_CAPTURE)
                      i.putExtra(MediaStore.EXTRA_OUTPUT, camUri)
                      startActivityForResult(i, 13)
                  } catch (e: Exception) {
                      status.text = "No pude abrir la cámara, señor."
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (resultCode != RESULT_OK) return
                  val uri = if (requestCode == 13) camUri else data?.data
                  if (uri != null) askAbout(uri)
              }

              private fun askAbout(uri: Uri) {
                  val box = EditText(this)
                  box.hint = "¿Qué desea saber? (vacío = describir)"
                  box.setSingleLine(true)
                  AlertDialog.Builder(this)
                      .setTitle("Enviar a Cerberus")
                      .setView(box)
                      .setNegativeButton("Cancelar", null)
                      .setPositiveButton("Enviar") { _, _ ->
                          sendAttachment(uri, box.text.toString().trim().ifEmpty { "Describe esto con detalle breve." })
                      }
                      .show()
              }

              private fun sendAttachment(uri: Uri, prompt: String) {
                  if (!hasMic()) {
                      status.text = "Primero necesito permisos, señor."
                      askPermissions()
                      return
                  }
                  status.text = "Leyendo el archivo…"
                  neural.state = "thinking"
                  Thread {
                      val att = Attach.fromUri(this, uri)
                      runOnUiThread {
                          if (att == null) {
                              neural.state = "idle"
                              status.text = "No pude leer ese archivo, señor."
                          } else {
                              Attach.stash(this, att)
                              val i = Intent(this, CerberusService::class.java)
                              i.action = "ASK_ATTACH"
                              i.putExtra("prompt", prompt)
                              startForegroundService(i)
                              Bus.running = true
                              refreshButton()
                          }
                      }
                  }.start()
              }

              // ---------- permisos ----------

              private fun askPermissions() {
                  val list = arrayListOf(
                      Manifest.permission.RECORD_AUDIO,
                      Manifest.permission.CALL_PHONE,
                      Manifest.permission.READ_CONTACTS,
                      Manifest.permission.ANSWER_PHONE_CALLS,
                      Manifest.permission.READ_PHONE_STATE,
                      Manifest.permission.READ_CALL_LOG
                  )
                  if (Build.VERSION.SDK_INT >= 33) list.add(Manifest.permission.POST_NOTIFICATIONS)
                  requestPermissions(list.toTypedArray(), 7)
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  status.text = "Permisos procesados. Ya puede activar a Cerberus, señor."
              }
          }
