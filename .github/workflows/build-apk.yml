                  ft.textSize = 15f
                  ft.setTextColor(0xFFB8CCDA.toInt())
                  ft.text = if (facts.isEmpty()) "Nada todavía. Diga: «Cerberus, recuerda que mi cumpleaños es el 5 de mayo»."
                  else facts.joinToString("\n") { "•  " + it }
                  col.addView(ft)
