          package com.carlosart.cerberus

          import android.accessibilityservice.AccessibilityService
          import android.content.Context
          import android.os.Build
          import org.json.JSONArray
          import org.json.JSONObject

          /** Herramientas que la IA puede llamar para actuar sobre el teléfono (modo autónomo). */
          object Tools {

              class Def(val name: String, val desc: String, val params: List<Array<String>>)

              private fun p(n: String, t: String, d: String, req: Boolean = true) =
                  arrayOf(n, t, d, if (req) "1" else "0")

              private val webDef = Def(
                  "web_search",
                  "Busca información actual en internet: noticias, clima, precios, deportes, datos recientes.",
                  listOf(p("query", "string", "texto a buscar"))
              )

              val defs: List<Def> = listOf(
                  Def("open_app", "Abre una aplicación instalada por su nombre.", listOf(p("name", "string", "nombre de la app"))),
                  Def("call_contact", "Llama por teléfono normal a un contacto de la agenda.", listOf(p("contact", "string", "nombre del contacto"))),
                  Def(
                      "whatsapp_message", "Envía un mensaje de WhatsApp a un contacto de la agenda.",
                      listOf(p("contact", "string", "nombre del contacto"), p("message", "string", "texto del mensaje"))
                  ),
                  Def(
                      "whatsapp_call", "Hace una llamada de WhatsApp (voz o video) a un contacto de la agenda.",
                      listOf(p("contact", "string", "nombre del contacto"), p("video", "boolean", "true si es videollamada", false))
                  ),
                  Def("answer_call", "Contesta la llamada entrante.", emptyList()),
                  Def("hang_up", "Cuelga o rechaza la llamada.", emptyList()),
                  Def("torch", "Enciende o apaga la linterna.", listOf(p("on", "boolean", "true enciende, false apaga"))),
                  Def("volume", "Sube o baja el volumen.", listOf(p("direction", "string", "up o down"))),
                  Def("remember", "Guarda un dato sobre el señor en la memoria permanente.", listOf(p("fact", "string", "dato a recordar"))),
                  Def("tap_text", "Toca en pantalla el elemento que contenga ese texto (requiere accesibilidad).", listOf(p("text", "string", "texto visible del botón o elemento"))),
                  Def("type_text", "Escribe texto en el campo activo (requiere accesibilidad).", listOf(p("text", "string", "texto a escribir"))),
                  Def("scroll", "Desplaza la pantalla.", listOf(p("direction", "string", "up o down"))),
                  Def("press", "Botón del sistema: home, back, recents, notifications o screenshot.", listOf(p("button", "string", "home, back, recents, notifications, screenshot"))),
                  Def("read_screen", "Ve la pantalla actual: lista cada elemento con su etiqueta, si es botón o texto, y las coordenadas x,y de su centro. Úsala para decidir qué pulsar.", emptyList()),
                  Def("look_screen", "Toma una captura de la pantalla y la analiza con visión. Úsala si read_screen no basta. Devuelve posiciones en porcentaje.", listOf(p("question", "string", "qué quieres saber de la pantalla"))),
                  Def("tap_xy", "Toca la pantalla en unas coordenadas x,y (úsala para iconos sin nombre, con las coordenadas que dio read_screen).", listOf(p("x", "number", "coordenada x"), p("y", "number", "coordenada y"), p("percent", "boolean", "true si x e y son porcentajes (0-100) de la pantalla, como da look_screen", false))),
                  Def("wait", "Espera unos segundos a que cargue una pantalla.", listOf(p("seconds", "number", "segundos, de 1 a 6")))
              )

              private fun schema(d: Def, forGemini: Boolean): JSONObject? {
                  if (d.params.isEmpty()) return if (forGemini) null else JSONObject().put("type", "object").put("properties", JSONObject())
                  val props = JSONObject()
                  val req = JSONArray()
                  for (a in d.params) {
                      props.put(a[0], JSONObject().put("type", a[1]).put("description", a[2]))
                      if (a[3] == "1") req.put(a[0])
                  }
                  return JSONObject().put("type", "object").put("properties", props).put("required", req)
              }

              private fun all(web: Boolean): List<Def> = if (web) defs + webDef else defs

              fun openai(web: Boolean): JSONArray {
                  val out = JSONArray()
                  for (d in all(web)) {
                      val fn = JSONObject().put("name", d.name).put("description", d.desc)
                      schema(d, false)?.let { fn.put("parameters", it) }
                      out.put(JSONObject().put("type", "function").put("function", fn))
                  }
                  return out
              }

              fun gemini(web: Boolean): JSONArray {
                  val decl = JSONArray()
                  for (d in all(web)) {
                      val fn = JSONObject().put("name", d.name).put("description", d.desc)
                      schema(d, true)?.let { fn.put("parameters", it) }
                      decl.put(fn)
                  }
                  return JSONArray().put(JSONObject().put("functionDeclarations", decl))
              }

              // ---- confirmación antes de acciones que afectan a terceros ----
              @Volatile private var pending: Pair<String, JSONObject>? = null
              @Volatile private var pendingAt = 0L

              fun needsConfirm(n: String) = n == "whatsapp_message" || n == "call_contact" || n == "whatsapp_call"

              fun question(n: String, a: JSONObject): String = when (n) {
                  "whatsapp_message" -> "Señor, ¿confirma que envíe a " + a.optString("contact") + " por WhatsApp: " + a.optString("message") + "?"
                  "call_contact" -> "Señor, ¿confirma que llame a " + a.optString("contact") + "?"
                  else -> "Señor, ¿confirma que llame por WhatsApp a " + a.optString("contact") + "?"
              }

              fun setPending(n: String, a: JSONObject) {
                  pending = Pair(n, a)
                  pendingAt = System.currentTimeMillis()
              }

              fun takePending(): Pair<String, JSONObject>? {
                  val p = pending
                  pending = null
                  return if (p != null && System.currentTimeMillis() - pendingAt < 120000L) p else null
              }

              fun run(ctx: Context, a: Actions, name: String, args: JSONObject): String {
                  fun acc(block: (CerberusAccess) -> String): String =
                      CerberusAccess.inst?.let(block)
                          ?: "La accesibilidad no está activada. Dígale al señor que la active en Ajustes, botón 4."
                  return try {
                      when (name) {
                          "open_app" -> {
                              val r = a.openApp(args.optString("name"))
                              Thread.sleep(1500)
                              r
                          }
                          "call_contact" -> a.call(args.optString("contact"))
                          "whatsapp_message" -> a.whatsappSend(args.optString("contact"), args.optString("message"))
                          "whatsapp_call" -> a.whatsappCall(args.optString("contact"), args.optBoolean("video", false))
                          "answer_call" -> a.answer()
                          "hang_up" -> a.hangup()
                          "torch" -> a.torch(args.optBoolean("on", true))
                          "volume" -> a.volume(args.optString("direction") != "down")
                          "remember" -> {
                              Store.addFact(ctx, args.optString("fact"))
                              "Anotado."
                          }
                          "tap_text" -> acc { if (it.clickText(args.optString("text"))) "Pulsado." else "No encontré ese texto en la pantalla." }
                          "type_text" -> acc { if (it.typeText(args.optString("text"))) "Escrito." else "No hay un campo de texto activo." }
                          "scroll" -> acc {
                              it.scroll(args.optString("direction") != "up")
                              "Hecho."
                          }
                          "press" -> acc {
                              val g = when (args.optString("button")) {
                                  "home" -> AccessibilityService.GLOBAL_ACTION_HOME
                                  "back" -> AccessibilityService.GLOBAL_ACTION_BACK
                                  "recents" -> AccessibilityService.GLOBAL_ACTION_RECENTS
                                  "notifications" -> AccessibilityService.GLOBAL_ACTION_NOTIFICATIONS
                                  "screenshot" -> if (Build.VERSION.SDK_INT >= 28) AccessibilityService.GLOBAL_ACTION_TAKE_SCREENSHOT else -1
                                  else -> -1
                              }
                              if (g < 0) {
                                  "Botón desconocido."
                              } else {
                                  it.global(g)
                                  "Hecho."
                              }
                          }
                          "read_screen" -> acc { it.describeScreen() }
                          "tap_xy" -> acc {
                              var x = args.optDouble("x", -1.0).toFloat()
                              var y = args.optDouble("y", -1.0).toFloat()
                              if (args.optBoolean("percent", false)) {
                                  val dm = ctx.resources.displayMetrics
                                  x = x / 100f * dm.widthPixels
                                  y = y / 100f * dm.heightPixels
                              }
                              if (it.tapXY(x, y)) "Toque realizado." else "No pude tocar ahí."
                          }
                          "look_screen" -> acc {
                              val b = it.screenshotB64()
                              if (b == null) "No pude capturar la pantalla (requiere Android 11 o superior y reactivar la accesibilidad)."
                              else Brain(ctx).vision(b, args.optString("question", "Describe la pantalla."))
                          }
                          "wait" -> {
                              val s = args.optDouble("seconds", 1.0)
                              Thread.sleep((s.coerceIn(0.5, 6.0) * 1000).toLong())
                              "Listo."
                          }
                          "web_search" -> Search.web(args.optString("query"))
                          else -> "Herramienta desconocida."
                      }
                  } catch (e: Exception) {
                      "Error: " + (e.message ?: "falló")
                  }
              }
          }
