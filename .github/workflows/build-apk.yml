                          msgs.put(JSONObject().put("role", "system").put("content", sys))
                          for ((r, t) in hist) msgs.put(JSONObject().put("role", r).put("content", t))
                          if (b64 != null) {
                              val content = JSONArray()
                              content.put(JSONObject().put("type", "text").put("text", prompt))
                              content.put(JSONObject().put("type", "image_url")
                                  .put("image_url", JSONObject().put("url", "data:" + attMime + ";base64," + b64)))
                              msgs.put(JSONObject().put("role", "user").put("content", content))
                          } else {
                              msgs.put(JSONObject().put("role", "user").put("content", prompt))
                          }
                          val headers = mapOf("Authorization" to ("Bearer " + key), "X-Title" to "Cerberus")
                          var tools = mode.isEmpty() || mode == "chat" || mode == "info"
                          Bus.emit("thinking", "Pensando…")
                          while (true) {
                              val body = JSONObject().put("model", model).put("messages", msgs)
                              if (tools) body.put("tools", Tools.openai(web))
                              val res = post(baseUrl + "/chat/completions", headers, body)
                              if (res.first !in 200..299) {
                                  if (tools && rounds == 0 && res.first in 400..404) {
                                      tools = false
                                      msgs.getJSONObject(0).put("content", sys + noTools)
                                      continue
                                  }
                                  return errMsg(res.first, res.second)
                              }
                              val msg = JSONObject(res.second).getJSONArray("choices").getJSONObject(0).getJSONObject("message")
                              val calls = msg.optJSONArray("tool_calls")
                              if (tools && calls != null && calls.length() > 0 && rounds < 7) {
                                  msgs.put(msg)
                                  var pq: String? = null
                                  for (k in 0 until calls.length()) {
                                      val call = calls.getJSONObject(k)
                                      val fn = call.getJSONObject("function")
                                      val args = try {
                                          JSONObject(fn.optString("arguments", "{}"))
                                      } catch (e: Exception) {
                                          JSONObject()
                                      }
                                      val r = runTool(fn.optString("name"), args, actions)
                                      if (r.startsWith("\u0001")) { pq = r.substring(1); break }
                                      msgs.put(JSONObject().put("role", "tool")
                                          .put("tool_call_id", call.optString("id"))
                                          .put("content", r))
                                  }
                                  if (pq != null) { ans = pq; break }
                                  rounds++
                                  continue
                              }
                              ans = if (msg.isNull("content")) "" else msg.getString("content")
                              break
                          }
                      }
                      ans = (if (mode.isEmpty()) ans.replace("*", "") else ans.replace("**", "")).trim()
                      if (ans.isEmpty() && rounds > 0) ans = "Hecho, señor."
                      if (ans.isEmpty()) return "Señor, no obtuve respuesta."
                      Store.append(ctx, "user", if (att != null) "[adjunto: " + att.name + "] " + user else user)
                      Store.append(ctx, "assistant", ans)
                      return ans
                  } catch (e: Exception) {
                      return "Señor, no pude conectar con " + Cfg.name(prov) + ". Revise su internet."
                  }
              }
          }
