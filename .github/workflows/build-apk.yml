                      val c = chats.getJSONObject(i)
                      val head = TextView(this)
                      val t = c.optString("title", "").ifEmpty { "Conversación" }
                      head.text = df.format(Date(c.optLong("ts", 0L))) + "  ·  " + t
                      head.textSize = 15f
                      head.setTextColor(0xFFE8F6FF.toInt())
