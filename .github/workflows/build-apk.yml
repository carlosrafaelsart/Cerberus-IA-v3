                  val root = rootInActiveWindow ?: return false
                  val f = root.findFocus(AccessibilityNodeInfo.FOCUS_INPUT) ?: return false
                  val args = Bundle()
                  val old = f.text?.toString() ?: ""
                  args.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, old + t)
                  return f.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args)
              }

              fun scroll(forward: Boolean): Boolean {
                  val root = rootInActiveWindow ?: return false
                  val all = ArrayList<AccessibilityNodeInfo>()
                  walk(root, all)
                  val s = all.firstOrNull { it.isScrollable } ?: return false
                  return s.performAction(
                      if (forward) AccessibilityNodeInfo.ACTION_SCROLL_FORWARD else AccessibilityNodeInfo.ACTION_SCROLL_BACKWARD
                  )
              }

              fun readScreen(): String {
                  val root = rootInActiveWindow ?: return "No puedo ver la pantalla, señor."
                  val all = ArrayList<AccessibilityNodeInfo>()
                  walk(root, all)
                  val texts = all.mapNotNull { (it.text ?: it.contentDescription)?.toString()?.trim() }
                      .filter { it.isNotEmpty() }
                      .distinct()
                  if (texts.isEmpty()) return "No veo texto en la pantalla, señor."
                  return texts.joinToString(". ").take(450)
              }

              /** Lista de lo que hay en pantalla: etiqueta, si es botón o texto y su centro (x,y), para que la IA decida qué pulsar. */
              fun describeScreen(): String {
                  val root = rootInActiveWindow ?: return "No puedo ver la pantalla."
                  val all = ArrayList<AccessibilityNodeInfo>()
                  walk(root, all)
                  val r = Rect()
                  val dm = resources.displayMetrics
                  val sb = StringBuilder("Pantalla " + dm.widthPixels + "x" + dm.heightPixels + ". Elementos (etiqueta | tipo | centro x,y):\n")
                  val seen = HashSet<String>()
                  var count = 0
                  for (n in all) {
                      if (!n.isVisibleToUser) continue
                      val lab = (n.text ?: n.contentDescription ?: "").toString().trim().replace("\n", " ").take(50)
                      val click = n.isClickable
                      if (lab.isEmpty() && !click) continue
                      n.getBoundsInScreen(r)
                      if (r.width() <= 0 || r.height() <= 0) continue
                      val id = n.viewIdResourceName?.substringAfter("/") ?: ""
                      val name = if (lab.isEmpty()) "(sin nombre" + (if (id.isNotEmpty()) ":" + id else "") + ")" else lab
                      val line = name + " | " + (if (click) "botón" else "texto") + " | " + r.centerX() + "," + r.centerY()
                      if (seen.add(line)) {
                          sb.append(line).append('\n')
                          count++
                      }
                      if (count >= 45) break
                  }
                  return sb.toString().take(2200)
              }

              fun tapXY(x: Float, y: Float): Boolean {
                  val path = Path()
                  path.moveTo(x, y)
                  val g = GestureDescription.Builder().addStroke(GestureDescription.StrokeDescription(path, 0L, 70L)).build()
                  return dispatchGesture(g, null, null)
              }

              /** Captura de pantalla en JPEG base64 (Android 11+). Devuelve null si no se pudo. */
              fun screenshotB64(): String? {
                  if (android.os.Build.VERSION.SDK_INT < 30) return null
                  val latch = CountDownLatch(1)
                  var bmp: Bitmap? = null
                  try {
                      takeScreenshot(Display.DEFAULT_DISPLAY, java.util.concurrent.Executor { it.run() },
                          object : AccessibilityService.TakeScreenshotCallback {
                              override fun onSuccess(r: AccessibilityService.ScreenshotResult) {
                                  try {
                                      val hb = r.hardwareBuffer
                                      val b = Bitmap.wrapHardwareBuffer(hb, r.colorSpace)
                                      bmp = b?.copy(Bitmap.Config.ARGB_8888, false)
                                      hb.close()
                                  } catch (e: Exception) {
                                  }
                                  latch.countDown()
                              }

                              override fun onFailure(errorCode: Int) {
                                  latch.countDown()
                              }
                          })
                  } catch (e: Exception) {
                      return null
                  }
                  latch.await(6, TimeUnit.SECONDS)
                  val b = bmp ?: return null
                  val k = 1024f / maxOf(b.width, b.height)
                  val sc = if (k < 1f) Bitmap.createScaledBitmap(b, (b.width * k).toInt(), (b.height * k).toInt(), true) else b
                  val out = ByteArrayOutputStream()
                  sc.compress(Bitmap.CompressFormat.JPEG, 70, out)
                  return Base64.encodeToString(out.toByteArray(), Base64.NO_WRAP)
              }
          }
