                  help.text = when (id) {
                      "gemini" -> "Clave gratis en aistudio.google.com/apikey (empieza con AIza)."
                      "groq" -> "Clave gratis en console.groq.com/keys (empieza con gsk_)."
                      "openrouter" -> "Clave en openrouter.ai/keys. Los modelos que terminan en :free no cuestan."
                      else -> "Cualquier servicio compatible con OpenAI: escriba su dirección base, clave y modelo."
                  }
                  testOut.text = ""
              }

              private fun saveFields(id: String) {
                  val e = Cfg.prefs(this).edit()
                  e.putString("key_" + id, keyBox.text.toString().trim())
                  e.putString("model_" + id, modelBox.text.toString().trim())
                  if (id == "custom") e.putString("base_custom", baseBox.text.toString().trim())
                  e.putString("provider", id)
                  e.apply()
              }

              private fun fillVoices() {
                  val vs: List<Voice> = try {
                      (tts?.voices ?: emptySet<Voice>()).filter { it.locale.language == "es" }
                          .sortedWith(compareByDescending<Voice> { it.quality }.thenBy { it.name })
                  } catch (e: Exception) {
                      emptyList()
                  }
                  voices = ArrayList(vs)
                  val labels = ArrayList<String>()
                  labels.add("Predeterminada del teléfono")
                  for (v in vs) {
                      labels.add(
                          (if (v.quality >= Voice.QUALITY_VERY_HIGH) "★ " else "") + v.locale.displayName + " · " + v.name +
                              (if (v.isNetworkConnectionRequired) " (en línea)" else "")
                      )
                  }
                  val ad = ArrayAdapter<String>(this, android.R.layout.simple_spinner_item, labels)
                  ad.setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item)
                  voiceSpinner.adapter = ad
                  val saved = Cfg.prefs(this).getString("voice", "") ?: ""
                  val i = vs.indexOfFirst { it.name == saved }
                  voiceSpinner.setSelection(if (i >= 0) i + 1 else 0)
              }

              private fun chosenVoice(): Voice? {
                  val p = voiceSpinner.selectedItemPosition
                  return if (p >= 1 && p - 1 < voices.size) voices[p - 1] else null
              }

              private fun rate(): Float = 0.7f + rateBar.progress / 100f

              private fun speakSample() {
                  val t = tts ?: return
                  val v = chosenVoice()
                  if (v != null) t.voice = v else t.language = java.util.Locale("es", "MX")
                  t.setSpeechRate(rate())
                  t.setPitch(1.0f)
                  t.speak("A sus órdenes, señor. Esta es mi voz.", TextToSpeech.QUEUE_FLUSH, null, "sample")
              }

              private fun saveVoice() {
                  if (voiceSpinner.adapter == null) return
                  val e = Cfg.prefs(this).edit()
                  e.putString("voice", chosenVoice()?.name ?: "")
                  e.putFloat("rate", rate())
                  e.apply()
              }

              override fun onPause() {
                  if (cur.isNotEmpty()) saveFields(cur)
                  saveVoice()
                  super.onPause()
              }

              override fun onDestroy() {
                  tts?.shutdown()
                  super.onDestroy()
              }

              private fun askPermissions() {
                  val list = arrayListOf(
                      Manifest.permission.RECORD_AUDIO,
                      Manifest.permission.CALL_PHONE,
                      Manifest.permission.READ_CONTACTS,
                      Manifest.permission.ANSWER_PHONE_CALLS,
                      Manifest.permission.READ_PHONE_STATE,
                      Manifest.permission.READ_CALL_LOG
                  )
                  if (Build.VERSION.SDK_INT >= 33) list.add(Manifest.permission.POST_NOTIFICATIONS)
                  requestPermissions(list.toTypedArray(), 7)
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  testOut.text = "Permisos procesados, señor."
              }
          }
          CERBEOF
          mkdir -p app/src/main/java/com/carlosart/cerberus
          cat > app/src/main/java/com/carlosart/cerberus/Store.kt <<'CERBEOF'
          package com.carlosart.cerberus

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File

          /** Memoria local de Cerberus: conversaciones y datos que debe recordar. Todo queda en el teléfono. */
          object Store {
              private const val IDLE_MS = 30 * 60 * 1000L

              private fun f(c: Context, n: String) = File(c.filesDir, n)

              private fun read(c: Context, n: String): JSONArray =
                  try { JSONArray(f(c, n).readText()) } catch (e: Exception) { JSONArray() }

              private fun write(c: Context, n: String, a: JSONArray) {
                  try { f(c, n).writeText(a.toString()) } catch (e: Exception) { }
              }

              // ---------- conversaciones ----------

              @Synchronized fun chats(c: Context): JSONArray = read(c, "chats.json")

              @Synchronized fun append(c: Context, role: String, text: String) {
                  val all = read(c, "chats.json")
                  val now = System.currentTimeMillis()
                  val last: JSONObject? = if (all.length() > 0) all.getJSONObject(all.length() - 1) else null
                  val conv: JSONObject
                  if (last == null || now - last.optLong("ts", 0L) > IDLE_MS) {
                      conv = JSONObject().put("ts", now).put("title", "").put("messages", JSONArray())
                      all.put(conv)
                      while (all.length() > 100) all.remove(0)
                  } else {
                      conv = last
                  }
                  conv.getJSONArray("messages").put(JSONObject().put("r", role).put("t", text))
                  conv.put("ts", now)
                  if (conv.optString("title", "").isEmpty() && role == "user") conv.put("title", text.take(48))
                  write(c, "chats.json", all)
              }

              /** Últimos mensajes de la conversación activa (si pasaron más de 30 min, empieza una nueva). */
              @Synchronized fun recent(c: Context, n: Int): List<Pair<String, String>> {
                  val all = read(c, "chats.json")
                  if (all.length() == 0) return emptyList()
                  val conv = all.getJSONObject(all.length() - 1)
                  if (System.currentTimeMillis() - conv.optLong("ts", 0L) > IDLE_MS) return emptyList()
                  val m = conv.getJSONArray("messages")
                  val out = ArrayList<Pair<String, String>>()
                  for (i in maxOf(0, m.length() - n) until m.length()) {
                      val o = m.getJSONObject(i)
                      out.add(Pair(o.getString("r"), o.getString("t")))
                  }
                  return out
              }

              @Synchronized fun clearChats(c: Context) = write(c, "chats.json", JSONArray())

              // ---------- datos recordados ----------

              @Synchronized fun facts(c: Context): List<String> {
                  val a = read(c, "facts.json")
                  return (0 until a.length()).map { a.getString(it) }
              }

              @Synchronized fun addFact(c: Context, s: String) {
                  if (s.isBlank()) return
                  val a = read(c, "facts.json")
                  a.put(s.trim().take(300))
                  while (a.length() > 60) a.remove(0)
                  write(c, "facts.json", a)
              }

              @Synchronized fun clearFacts(c: Context) = write(c, "facts.json", JSONArray())

              @Synchronized fun removeFactsContaining(c: Context, q: String): Int {
                  val nq = q.lowercase().trim()
                  if (nq.isEmpty()) return 0
                  val a = read(c, "facts.json")
                  val keep = JSONArray()
                  var removed = 0
                  for (i in 0 until a.length()) {
                      val s = a.getString(i)
                      if (s.lowercase().contains(nq)) removed++ else keep.put(s)
                  }
                  write(c, "facts.json", keep)
                  return removed
              }
          }
          CERBEOF

      - name: Compilar APK
        run: gradle assembleDebug --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Cerberus-APK
          path: app/build/outputs/apk/debug/app-debug.apk
