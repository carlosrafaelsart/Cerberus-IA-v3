                  val pw = (resources.displayMetrics.widthPixels * 0.8f).toInt()
                  panel.translationX = -pw.toFloat()
                  frame.addView(panel, FrameLayout.LayoutParams(pw, FrameLayout.LayoutParams.MATCH_PARENT))

                  setContentView(frame)
                  window.setSoftInputMode(android.view.WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE)
