          package com.carlosart.cerberus

          import android.text.Html
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder

          /** Búsqueda en internet sin clave: DuckDuckGo y, si falla, Wikipedia. */
          object Search {

              private const val UA = "Mozilla/5.0 (Linux; Android 14; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36"

              private fun get(url: String): String {
                  val c = URL(url).openConnection() as HttpURLConnection
                  c.requestMethod = "GET"
                  c.setRequestProperty("User-Agent", UA)
                  c.setRequestProperty("Accept-Language", "es-ES,es;q=0.9,en;q=0.5")
                  c.connectTimeout = 10000
                  c.readTimeout = 15000
                  return try {
                      c.inputStream.bufferedReader().use { it.readText() }
                  } finally {
                      c.disconnect()
                  }
              }

              private fun clean(s: String): String =
                  Html.fromHtml(s, Html.FROM_HTML_MODE_LEGACY).toString().replace(Regex("\\s+"), " ").trim()

              private fun duck(q: String): List<String> {
                  val html = get("https://html.duckduckgo.com/html/?kl=wt-wt&q=" + URLEncoder.encode(q, "UTF-8"))
                  val links = Regex("class=\"result__a\"[^>]*>(.*?)</a>", RegexOption.DOT_MATCHES_ALL).findAll(html).toList()
                  val snips = Regex("class=\"result__snippet\"[^>]*>(.*?)</a>", RegexOption.DOT_MATCHES_ALL).findAll(html).toList()
                  val out = ArrayList<String>()
                  for (i in links.indices) {
                      if (out.size >= 5) break
                      val title = clean(links[i].groupValues[1])
                      val snip = if (i < snips.size) clean(snips[i].groupValues[1]) else ""
                      if (title.isNotEmpty()) out.add(if (snip.isNotEmpty()) "$title: $snip" else title)
                  }
                  return out
              }

              private fun wiki(q: String): List<String> {
                  val json = get(
                      "https://es.wikipedia.org/w/api.php?action=query&list=search&utf8=1&format=json&srlimit=4&srsearch=" +
                          URLEncoder.encode(q, "UTF-8")
                  )
                  val arr = JSONObject(json).getJSONObject("query").getJSONArray("search")
                  val out = ArrayList<String>()
                  for (i in 0 until arr.length()) {
                      val o = arr.getJSONObject(i)
                      out.add(o.optString("title") + ": " + clean(o.optString("snippet")))
                  }
                  return out
              }

              /** Resultados listos para dárselos a la IA como texto. */
              fun web(q: String): String {
                  var r: List<String> = try { duck(q) } catch (e: Exception) { emptyList() }
                  if (r.isEmpty()) r = try { wiki(q) } catch (e: Exception) { emptyList() }
                  if (r.isEmpty()) return "No se encontraron resultados."
                  val sb = StringBuilder()
                  for ((i, s) in r.withIndex()) sb.append(i + 1).append(". ").append(s).append("\n")
                  return sb.toString().take(2500)
              }
          }
