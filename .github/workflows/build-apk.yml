          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import android.telephony.TelephonyManager
          import java.util.Locale
          import java.util.concurrent.Executors

          class CerberusService : Service(), TextToSpeech.OnInitListener {

              private var tts: TextToSpeech? = null
              private var ttsReady = false
              private var rec: SpeechRecognizer? = null
              private val main = Handler(Looper.getMainLooper())
              private val io = Executors.newSingleThreadExecutor()
              private lateinit var actions: Actions
              private lateinit var brain: Brain
              private var speaking = false
              private var listening = false
              private var stopped = false
              private var awakeUntil = 0L
              private var lastEvent = 0L

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  actions = Actions(this)
                  brain = Brain(this)
                  startAsForeground()
                  tts = TextToSpeech(this, this)
                  val f = IntentFilter(TelephonyManager.ACTION_PHONE_STATE_CHANGED)
                  if (Build.VERSION.SDK_INT >= 33) registerReceiver(phoneRx, f, Context.RECEIVER_EXPORTED)
                  else registerReceiver(phoneRx, f)
                  Bus.running = true
                  Bus.emit("idle", "Cerberus en línea.")
                  main.postDelayed({ watchdog() }, 15000)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == "ASK_TEXT") {
                      val q = intent.getStringExtra("text") ?: ""
                      if (q.isNotBlank()) main.post { execute(q) }
                  }
                  if (intent?.action == "ASK_ATTACH") {
                      val prompt = intent.getStringExtra("prompt") ?: "Describe esto."
                      Bus.emit("thinking", "Analizando…")
                      io.execute {
                          val att = Attach.take(this)
                          val ans = if (att == null) "No pude leer el adjunto, señor." else brain.ask(prompt, att)
                          main.post { say(ans) }
                      }
                  }
                  return START_STICKY
              }

              private fun startAsForeground() {
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  if (Build.VERSION.SDK_INT >= 26) {
                      nm.createNotificationChannel(NotificationChannel("cerberus", "Cerberus", NotificationManager.IMPORTANCE_LOW))
                  }
                  val open = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val n = Notification.Builder(this, "cerberus")
                      .setContentTitle("Cerberus a su servicio, señor")
                      .setContentText("Diga \"Cerberus\" seguido de una orden")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setContentIntent(open)
                      .setOngoing(true)
                      .build()
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)
                  } else {
                      startForeground(1, n)
                  }
              }

              // ---------------- voz (salida) ----------------

              override fun onInit(status: Int) {
                  val t = tts ?: return
                  val prefs = Cfg.prefs(this)
                  val vn = prefs.getString("voice", "") ?: ""
                  var voiceSet = false
                  if (vn.isNotEmpty()) {
                      try {
                          val v = t.voices?.firstOrNull { it.name == vn }
                          if (v != null) { t.voice = v; voiceSet = true }
                      } catch (e: Exception) { }
                  }
                  if (!voiceSet) t.language = Locale("es", "MX")
                  t.setSpeechRate(prefs.getFloat("rate", 1.0f))
                  t.setPitch(1.0f)
                  t.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                      override fun onStart(id: String?) { Bus.kick() }
                      override fun onRangeStart(utteranceId: String?, start: Int, end: Int, frame: Int) { Bus.kick() }
                      override fun onDone(id: String?) { afterSpeech() }
                      @Deprecated("Deprecated in Java")
                      override fun onError(id: String?) { afterSpeech() }
                  })
                  ttsReady = status == TextToSpeech.SUCCESS
                  say("Cerberus en línea. A sus órdenes, señor.")
              }

              private fun afterSpeech() {
                  main.post {
                      speaking = false
                      Bus.level = 0f
                      // tras responder, puede seguir hablando 10 s sin repetir el nombre
                      awakeUntil = maxOf(awakeUntil, System.currentTimeMillis() + 10000)
                      Bus.emit("idle", "")
                      listen()
                  }
              }

              private fun say(text: String) {
                  val t = tts
                  if (!ttsReady || t == null) { Bus.emit("idle", text); listen(); return }
                  speaking = true
                  listening = false
                  try { rec?.cancel() } catch (e: Exception) { }
                  Bus.emit("speaking", text)
                  t.speak(text, TextToSpeech.QUEUE_FLUSH, null, "cerberus")
              }

              private fun beep() {
                  try {
                      val tg = ToneGenerator(AudioManager.STREAM_MUSIC, 70)
                      tg.startTone(ToneGenerator.TONE_PROP_ACK, 140)
                      main.postDelayed({ try { tg.release() } catch (e: Exception) { } }, 500)
                  } catch (e: Exception) { }
              }

              // ---------------- voz (entrada) ----------------

              private fun recIntent(): Intent {
                  val dev = Locale.getDefault()
                  val tag = if (dev.language == "es") dev.toLanguageTag() else "es-ES"
                  val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                      .putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      .putExtra(RecognizerIntent.EXTRA_LANGUAGE, tag)
                      .putExtra(RecognizerIntent.EXTRA_CALLING_PACKAGE, packageName)
                      .putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 5)
                      .putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_COMPLETE_SILENCE_LENGTH_MILLIS, 2200L)
                      .putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_POSSIBLY_COMPLETE_SILENCE_LENGTH_MILLIS, 1800L)
                  if (Build.VERSION.SDK_INT >= 33) {
                      i.putStringArrayListExtra(RecognizerIntent.EXTRA_BIASING_STRINGS, arrayListOf("Cerberus"))
                  }
                  return i
              }

              private fun listen(delayMs: Long = 0L) {
                  if (stopped) return
                  main.postDelayed({ startNow() }, delayMs)
              }

              private fun startNow() {
                  if (stopped || speaking || listening) return
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      Bus.emit("idle", "Reconocimiento de voz no disponible en este teléfono.")
                      return
                  }
                  val r: SpeechRecognizer = rec ?: SpeechRecognizer.createSpeechRecognizer(this).also {
                      it.setRecognitionListener(listener)
                      rec = it
                  }
                  try {
                      r.startListening(recIntent())
                      listening = true
                      lastEvent = System.currentTimeMillis()
                  } catch (e: Exception) {
                      try { r.destroy() } catch (x: Exception) { }
                      rec = null
                      listening = false
                      listen(600)
                      return
                  }
                  val awake = System.currentTimeMillis() < awakeUntil
                  Bus.emit("listening", if (awake) "Escuchando…" else "Diga \"Cerberus\"…")
              }

              /** Si el reconocedor se queda mudo sin avisar, lo reinicia. */
              private fun watchdog() {
                  if (stopped) return
                  if (!speaking && listening && System.currentTimeMillis() - lastEvent > 20000) {
                      try { rec?.destroy() } catch (e: Exception) { }
                      rec = null
                      listening = false
                      startNow()
                  }
                  main.postDelayed({ watchdog() }, 15000)
              }

              private val listener = object : RecognitionListener {
                  override fun onReadyForSpeech(params: Bundle?) { lastEvent = System.currentTimeMillis() }
                  override fun onBeginningOfSpeech() { lastEvent = System.currentTimeMillis() }
                  override fun onRmsChanged(rmsdB: Float) {
                      lastEvent = System.currentTimeMillis()
                      Bus.level = ((rmsdB + 2f) / 12f).coerceIn(0f, 1f)
                  }
                  override fun onBufferReceived(buffer: ByteArray?) {}
                  override fun onEndOfSpeech() {}
                  override fun onPartialResults(partialResults: Bundle?) {}
                  override fun onEvent(eventType: Int, params: Bundle?) {}

                  override fun onError(error: Int) {
                      listening = false
                      lastEvent = System.currentTimeMillis()
                      if (stopped || speaking) return
                      when (error) {
                          SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS ->
                              Bus.emit("idle", "Falta el permiso de micrófono, señor.")
                          SpeechRecognizer.ERROR_RECOGNIZER_BUSY -> {
                              try { rec?.cancel() } catch (e: Exception) { }
                              listen(400)
                          }
                          SpeechRecognizer.ERROR_CLIENT,
                          SpeechRecognizer.ERROR_SERVER,
                          SpeechRecognizer.ERROR_NETWORK,
                          SpeechRecognizer.ERROR_NETWORK_TIMEOUT -> {
                              try { rec?.destroy() } catch (e: Exception) { }
                              rec = null
                              listen(700)
                          }
                          else -> listen(80) // sin voz o sin coincidencia: vuelve a escuchar enseguida
                      }
                  }

                  override fun onResults(results: Bundle?) {
                      listening = false
                      lastEvent = System.currentTimeMillis()
                      handleList(results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION))
                  }
              }

              // ---------------- palabra de activación ----------------

              private fun lev(a: String, b: String): Int {
                  val d = Array(a.length + 1) { IntArray(b.length + 1) }
                  for (i in 0..a.length) d[i][0] = i
                  for (j in 0..b.length) d[0][j] = j
                  for (i in 1..a.length) for (j in 1..b.length) {
                      val c = if (a[i - 1] == b[j - 1]) 0 else 1
                      d[i][j] = minOf(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + c)
                  }
                  return d[a.length][b.length]
              }

              private val wakeAlias = setOf(
                  "servers", "serverus", "cervelus", "cerbero", "cerberos", "cervero", "cerveros",
                  "kerberus", "cerberu", "cerbers", "cerverus", "cerbelus", "serberus", "cerberoz"
              )

              private fun isWake(w: String): Boolean {
                  val n = Actions.norm(w).replace(" ", "")
                  if (n.length < 5 || n.length > 10) return false
                  return n in wakeAlias || n.startsWith("cerber") || lev(n, "cerberus") <= 2
              }

              /** Devuelve dónde termina la palabra de activación dentro del texto, o -1 si no está. */
              private fun findWake(low: String): Int {
                  val ms = Regex("[a-záéíóúñü]+").findAll(low).toList()
                  for (i in ms.indices) {
                      if (isWake(ms[i].value)) return ms[i].range.last + 1
                      if (i + 1 < ms.size && isWake(ms[i].value + ms[i + 1].value)) return ms[i + 1].range.last + 1
                  }
                  return -1
              }

              private fun handleList(list: List<String>?) {
                  if (list.isNullOrEmpty()) { listen(); return }
                  val now = System.currentTimeMillis()
                  for (t in list) {
                      val low = t.lowercase(Locale.ROOT)
                      val e = findWake(low)
                      if (e >= 0) {
                          val cmd = low.substring(e).trim(' ', ',', '.', ':', '¿', '?', '!')
                          if (cmd.isEmpty()) {
                              awakeUntil = now + 10000
                              beep()
                              Bus.emit("listening", "Dígame, señor…")
                              listen()
                          } else {
                              execute(cmd)
                          }
                          return
                      }
                  }
                  if (now < awakeUntil) execute(list[0]) else listen()
              }

              private fun execute(cmd: String) {
                  awakeUntil = 0L
                  Bus.emit("thinking", cmd)
                  io.execute {
                      val ans = actions.tryHandle(cmd) ?: brain.ask(cmd)
                      main.post { say(ans) }
                  }
              }

              private val phoneRx = object : BroadcastReceiver() {
                  override fun onReceive(c: Context, i: Intent) {
                      if (i.getStringExtra(TelephonyManager.EXTRA_STATE) != TelephonyManager.EXTRA_STATE_RINGING) return
                      val num = i.getStringExtra(TelephonyManager.EXTRA_INCOMING_NUMBER)
                      val who = if (num.isNullOrEmpty()) null else actions.contactName(num)
                      awakeUntil = System.currentTimeMillis() + 20000
                      say("Señor, entra una llamada" + (if (who != null) " de $who" else "") + ". ¿La contesto?")
                  }
              }

              override fun onDestroy() {
                  stopped = true
                  Bus.running = false
                  try { unregisterReceiver(phoneRx) } catch (e: Exception) {}
                  try { rec?.destroy() } catch (e: Exception) {}
                  tts?.shutdown()
                  io.shutdownNow()
                  Bus.emit("idle", "Cerberus desactivado.")
                  super.onDestroy()
              }
          }
