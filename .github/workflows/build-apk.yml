                      lp.topMargin = dp(8)
                      head.layoutParams = lp

                      val body = TextView(this)
                      val m = c.optJSONArray("messages")
                      val sb = StringBuilder()
                      if (m != null) for (k in 0 until m.length()) {
                          val o = m.getJSONObject(k)
                          sb.append(if (o.optString("r") == "user") "Usted: " else "Cerberus: ")
                          sb.append(o.optString("t")).append("\n\n")
                      }
                      body.text = sb.toString().trim()
                      body.textSize = 14f
                      body.setTextColor(0xFFB8CCDA.toInt())
                      body.setPadding(dp(12), dp(8), dp(12), dp(8))
                      body.visibility = View.GONE
                      head.setOnClickListener {
                          body.visibility = if (body.visibility == View.GONE) View.VISIBLE else View.GONE
                      }
                      col.addView(head)
                      col.addView(body)
                  }
                  if (chats.length() > 0) col.addView(button("Borrar todo el historial") { Store.clearChats(this); recreate() })

                  val sv = ScrollView(this)
                  sv.setBackgroundColor(0xFF050A14.toInt())
                  sv.addView(col)
                  setContentView(sv)
              }
          }
