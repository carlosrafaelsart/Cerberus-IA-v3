          /** Marco con esquinas cortadas y brillo neón. */
          class ChamferBg(private val fill: Int, private val stroke: Int, private val cut: Float, private val sw: Float) : Drawable() {
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val path = Path()

              override fun onBoundsChange(b: Rect) {
                  val l = b.left + sw * 2f
                  val t = b.top + sw * 2f
                  val r = b.right - sw * 2f
                  val bt = b.bottom - sw * 2f
                  path.reset()
                  path.moveTo(l + cut, t)
                  path.lineTo(r - cut, t)
                  path.lineTo(r, t + cut)
                  path.lineTo(r, bt - cut)
                  path.lineTo(r - cut, bt)
                  path.lineTo(l + cut, bt)
                  path.lineTo(l, bt - cut)
                  path.lineTo(l, t + cut)
                  path.close()
              }

              override fun draw(c: Canvas) {
                  p.style = Paint.Style.FILL
                  p.color = fill
                  c.drawPath(path, p)
                  p.style = Paint.Style.STROKE
                  p.strokeJoin = Paint.Join.ROUND
                  p.strokeWidth = sw * 3f
                  p.color = (stroke and 0xFFFFFF) or (0x30 shl 24)
                  c.drawPath(path, p)
                  p.strokeWidth = sw
                  p.color = stroke
                  c.drawPath(path, p)
              }

              override fun setAlpha(alpha: Int) {}
              override fun setColorFilter(colorFilter: ColorFilter?) {}

              @Suppress("DEPRECATION")
              override fun getOpacity(): Int = PixelFormat.TRANSLUCENT
          }

