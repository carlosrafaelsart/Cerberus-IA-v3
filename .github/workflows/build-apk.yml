name: Build Cerberus APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generar proyecto Cerberus
        run: |
          cat > settings.gradle <<'CERBEOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Cerberus"
          include ':app'
          CERBEOF
          cat > build.gradle <<'CERBEOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          CERBEOF
          cat > gradle.properties <<'CERBEOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          CERBEOF
          mkdir -p app
          cat > app/build.gradle <<'CERBEOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.carlosart.cerberus'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.carlosart.cerberus'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          CERBEOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'CERBEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.ANSWER_PHONE_CALLS" />
              <uses-permission android:name="android.permission.READ_PHONE_STATE" />
              <uses-permission android:name="android.permission.READ_CALL_LOG" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />

              <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="false"
                  android:label="Cerberus"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".SettingsActivity"
                      android:exported="false" />

                  <activity
                      android:name=".HistoryActivity"
                      android:exported="false" />

                  <service
                      android:name=".CerberusService"
                      android:exported="false"
                      android:foregroundServiceType="microphone" />

                  <service
                      android:name=".CerberusAccess"
                      android:exported="false"
                      android:label="Cerberus"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          CERBEOF
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/accessibility_config.xml <<'CERBEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagIncludeNotImportantViews|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="100"
              android:description="@string/acc_desc" />
          CERBEOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'CERBEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="acc_desc">Permite a Cerberus tocar botones, escribir, desplazar la pantalla y enviar mensajes por orden de voz del señor.</string>
          </resources>
          CERBEOF
          mkdir -p app/src/main/java/com/carlosart/cerberus
          cat > app/src/main/java/com/carlosart/cerberus/Actions.kt <<'CERBEOF'
          package com.carlosart.cerberus

          import android.Manifest
          import android.accessibilityservice.AccessibilityService
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.hardware.camera2.CameraCharacteristics
          import android.hardware.camera2.CameraManager
          import android.media.AudioManager
          import android.net.Uri
          import android.os.BatteryManager
          import android.os.Build
          import android.provider.ContactsContract
          import android.telecom.TelecomManager
          import java.net.URLEncoder
          import java.text.Normalizer
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class Actions(private val ctx: Context) {

              companion object {
                  fun norm(s: String): String {
                      val d = Normalizer.normalize(s.lowercase(Locale.ROOT), Normalizer.Form.NFD)
                      return d.replace(Regex("\\p{M}+"), "")
                          .replace(Regex("[^a-z0-9 ]"), " ")
                          .replace(Regex("\\s+"), " ")
                          .trim()
                  }
              }

              private fun has(perm: String) = ctx.checkSelfPermission(perm) == PackageManager.PERMISSION_GRANTED

              /** Devuelve la respuesta hablada si el comando es local; null si debe responder Gemini. */
              fun tryHandle(raw: String): String? {
                  val t = norm(raw)
                  if (t.isEmpty()) return null

                  Regex("^(recuerda|anota|memoriza|guarda en tu memoria)( que)? (.+)$", RegexOption.IGNORE_CASE)
                      .find(raw.trim())?.let {
                          Store.addFact(ctx, it.groupValues[3].trim())
                          return "Anotado, señor."
                      }
                  if (Regex("que recuerdas|que sabes de mi|que has aprendido de mi").containsMatchIn(t)) {
                      val f = Store.facts(ctx)
                      return if (f.isEmpty()) "Aún no me ha pedido recordar nada, señor."
                      else "Recuerdo lo siguiente, señor. " + f.joinToString(". ")
                  }
                  if (Regex("^olvida (todo|lo que sabes)").containsMatchIn(t)) {
                      Store.clearFacts(ctx)
                      return "He olvidado todo lo anotado, señor."
                  }
                  Regex("^olvida que (.+)$").find(t)?.let { m ->
                      val n = Store.removeFactsContaining(ctx, m.groupValues[1])
                      return if (n > 0) "Olvidado, señor." else "No tenía eso anotado, señor."
                  }
                  if (Regex("borra (el )?historial").containsMatchIn(t)) {
                      Store.clearChats(ctx)
                      return "Historial borrado, señor."
                  }

                  if (Regex("quien (te )?(creo|hizo|programo|desarrollo)|tu creador").containsMatchIn(t))
                      return "Fui creado por CarlosArt, señor."

                  if (t.contains("linterna") || t.contains("flash")) {
                      val off = Regex("apaga|apagar|desactiva|quita").containsMatchIn(t)
                      return torch(!off)
                  }

                  if (Regex("^(si |por favor )?(contesta|contestar|atiende|atender|acepta la llamada|responde la llamada)").containsMatchIn(t))
                      return answer()

                  if (Regex("^(cuelga|colgar|termina la llamada|finaliza la llamada|rechaza)").containsMatchIn(t))
                      return hangup()

                  if (Regex("que hora es|dime la hora|hora actual").containsMatchIn(t)) {
                      val h = SimpleDateFormat("HH:mm", Locale.getDefault()).format(Date())
                      return "Son las $h, señor."
                  }

                  if (t.contains("bateria")) {
                      val bm = ctx.getSystemService(Context.BATTERY_SERVICE) as BatteryManager
                      val lvl = bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY)
                      return "Su batería está al $lvl por ciento, señor."
                  }

                  if (Regex("(sube|subir|aumenta|baja|bajar|disminuye).*volumen").containsMatchIn(t)) {
                      val up = Regex("sube|subir|aumenta").containsMatchIn(t)
                      val am = ctx.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                      repeat(3) {
                          am.adjustStreamVolume(
                              AudioManager.STREAM_MUSIC,
                              if (up) AudioManager.ADJUST_RAISE else AudioManager.ADJUST_LOWER,
                              AudioManager.FLAG_SHOW_UI
                          )
                      }
                      return if (up) "Volumen aumentado, señor." else "Volumen reducido, señor."
                  }

                  val needAcc = "Señor, active primero la accesibilidad de Cerberus con el botón 4."
                  fun acc(block: (CerberusAccess) -> String): String = CerberusAccess.inst?.let(block) ?: needAcc

                  Regex("^(manda|envia|enviale|mandale|escribe) (un )?(whatsapp|mensaje) a (.+?) (diciendo|que diga|con el mensaje|y dile que|y dile|dile que|dile) (.+)$", RegexOption.IGNORE_CASE)
                      .find(raw.trim())?.let { return whatsapp(it.groupValues[4], it.groupValues[6]) }

                  if (Regex("^(ve |ir |vuelve )?(al |a la |a )?(inicio|pantalla de inicio|pantalla principal)$").containsMatchIn(t))
                      return acc { it.global(AccessibilityService.GLOBAL_ACTION_HOME); "Hecho, señor." }
                  if (Regex("^(atras|regresa|vuelve atras|retrocede)$").containsMatchIn(t))
                      return acc { it.global(AccessibilityService.GLOBAL_ACTION_BACK); "Hecho, señor." }
                  if (t.contains("recientes"))
                      return acc { it.global(AccessibilityService.GLOBAL_ACTION_RECENTS); "Aquí están, señor." }
                  if (t.contains("notificaciones"))
                      return acc { it.global(AccessibilityService.GLOBAL_ACTION_NOTIFICATIONS); "Sus notificaciones, señor." }
                  if (Regex("captura|screenshot").containsMatchIn(t))
                      return acc {
                          if (Build.VERSION.SDK_INT >= 28) {
                              it.global(AccessibilityService.GLOBAL_ACTION_TAKE_SCREENSHOT)
                              "Captura tomada, señor."
                          } else "Su versión de Android no lo permite, señor."
                      }
                  if (Regex("^(baja|desplaza|desliza)( la pantalla| hacia abajo| abajo)$").containsMatchIn(t))
                      return acc { it.scroll(true); "Hecho, señor." }
                  if (Regex("^(sube|desliza)( la pantalla| hacia arriba| arriba)$").containsMatchIn(t))
                      return acc { it.scroll(false); "Hecho, señor." }
                  Regex("^(toca|pulsa|presiona|clic en|haz clic en|haz click en) (.+)$").find(t)?.let { m ->
                      return acc {
                          if (it.clickText(m.groupValues[2])) "Hecho, señor."
                          else "No encuentro " + m.groupValues[2] + " en la pantalla, señor."
                      }
                  }
                  Regex("^(escribe|teclea|dicta)\\s+(.+)$", RegexOption.IGNORE_CASE).find(raw.trim())?.let { m ->
                      return acc {
                          if (it.typeText(m.groupValues[2])) "Escrito, señor."
                          else "No hay un campo de texto activo, señor."
                      }
                  }
                  if (Regex("(lee|que dice|que hay en) (la |el )?(pantalla|screen)").containsMatchIn(t))
                      return acc { it.readScreen() }

                  Regex("^(llama|llamar|marca) (a |al )?(.+)$").find(t)?.let {
                      return call(it.groupValues[3])
                  }

                  Regex("^(busca|googlea|investiga) (en google |en internet )?(.+)$").find(t)?.let {
                      val q = URLEncoder.encode(it.groupValues[3], "UTF-8")
                      return launch(Intent(Intent.ACTION_VIEW, Uri.parse("https://www.google.com/search?q=$q")), "Buscando, señor.")
                  }

                  Regex("^(abre|abrir|abra|inicia|lanza|ejecuta) (.+)$").find(t)?.let {
                      val name = it.groupValues[2].replace(Regex("^(la |el |mi |app |aplicacion |de )+"), "")
                      return openApp(name)
                  }

                  return null
              }

              private fun launch(i: Intent, ok: String): String {
                  return try {
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      ctx.startActivity(i)
                      ok
                  } catch (e: Exception) {
                      "No pude hacerlo, señor."
                  }
              }

              private fun openApp(name: String): String {
                  val pm = ctx.packageManager
                  val li = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  val apps = pm.queryIntentActivities(li, 0)
                  val q = norm(name)
                  val match = apps.firstOrNull { norm(it.loadLabel(pm).toString()) == q }
                      ?: apps.firstOrNull { norm(it.loadLabel(pm).toString()).contains(q) }
                      ?: return "No encuentro la aplicación $name, señor."
                  val pkg = match.activityInfo.packageName
                  val intent = pm.getLaunchIntentForPackage(pkg) ?: return "No pude abrir $name, señor."
                  return launch(intent, "Abriendo $name, señor.")
              }

              private fun torch(on: Boolean): String {
                  return try {
                      val cm = ctx.getSystemService(Context.CAMERA_SERVICE) as CameraManager
                      val id = cm.cameraIdList.first {
                          cm.getCameraCharacteristics(it).get(CameraCharacteristics.FLASH_INFO_AVAILABLE) == true
                      }
                      cm.setTorchMode(id, on)
                      if (on) "Linterna encendida, señor." else "Linterna apagada, señor."
                  } catch (e: Exception) {
                      "No pude controlar la linterna, señor."
                  }
              }

              private fun call(name: String): String {
                  if (!has(Manifest.permission.READ_CONTACTS)) return "Señor, necesito permiso para leer sus contactos."
                  if (!has(Manifest.permission.CALL_PHONE)) return "Señor, necesito permiso para realizar llamadas."
                  val q = norm(name)
                  var bestName: String? = null
                  var bestNum: String? = null
                  ctx.contentResolver.query(
                      ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                      arrayOf(
                          ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME,
                          ContactsContract.CommonDataKinds.Phone.NUMBER
                      ), null, null, null
                  )?.use { c ->
                      while (c.moveToNext()) {
                          val n = c.getString(0) ?: continue
                          val num = c.getString(1) ?: continue
                          val nn = norm(n)
                          if (nn == q) { bestName = n; bestNum = num; break }
                          if (bestNum == null && nn.contains(q)) { bestName = n; bestNum = num }
                      }
                  }
                  val num = bestNum ?: return "No encuentro a $name en sus contactos, señor."
                  return launch(Intent(Intent.ACTION_CALL, Uri.parse("tel:" + Uri.encode(num))), "Llamando a $bestName, señor.")
              }

              private fun answer(): String {
                  if (!has(Manifest.permission.ANSWER_PHONE_CALLS)) return "Señor, me falta el permiso para contestar llamadas."
                  return try {
                      (ctx.getSystemService(Context.TELECOM_SERVICE) as TelecomManager).acceptRingingCall()
                      "Contestando, señor."
                  } catch (e: Exception) {
                      "No pude contestar, señor."
                  }
              }

              private fun hangup(): String {
                  if (Build.VERSION.SDK_INT < 28) return "Su versión de Android no me permite colgar, señor."
                  if (!has(Manifest.permission.ANSWER_PHONE_CALLS)) return "Señor, me falta el permiso para colgar llamadas."
                  return try {
                      (ctx.getSystemService(Context.TELECOM_SERVICE) as TelecomManager).endCall()
                      "Llamada finalizada, señor."
                  } catch (e: Exception) {
                      "No pude colgar, señor."
                  }
              }

              private fun findContact(q: String): Pair<String, String>? {
                  if (!has(Manifest.permission.READ_CONTACTS)) return null
                  val nq = norm(q)
                  var best: Pair<String, String>? = null
                  ctx.contentResolver.query(
                      ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                      arrayOf(
                          ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME,
                          ContactsContract.CommonDataKinds.Phone.NUMBER
                      ), null, null, null
                  )?.use { c ->
                      while (c.moveToNext()) {
                          val n = c.getString(0) ?: continue
                          val num = c.getString(1) ?: continue
                          val nn = norm(n)
                          if (nn == nq) { best = Pair(n, num); break }
                          if (best == null && nn.contains(nq)) best = Pair(n, num)
                      }
                  }
                  return best
              }

              private fun whatsapp(name: String, msg: String): String {
                  if (!has(Manifest.permission.READ_CONTACTS)) return "Señor, necesito permiso para leer sus contactos."
                  val found = findContact(name) ?: return "No encuentro a $name en sus contactos, señor."
                  val cname = found.first
                  var digits = found.second.filter { it.isDigit() }
                  // Números locales de 10 dígitos: se asume prefijo 1 (RD/EE.UU./Canadá). Cámbielo aquí si usa otro país.
                  if (!found.second.trim().startsWith("+") && digits.length == 10) digits = "1" + digits
                  val url = "https://wa.me/" + digits + "?text=" + URLEncoder.encode(msg, "UTF-8")
                  val i = Intent(Intent.ACTION_VIEW, Uri.parse(url)).setPackage("com.whatsapp")
                  if (launch(i, "ok") != "ok") return "No pude abrir WhatsApp, señor."
                  val acc = CerberusAccess.inst
                      ?: return "Dejé el mensaje para $cname listo en WhatsApp, señor. Active la accesibilidad para que yo lo envíe."
                  Thread {
                      Thread.sleep(3500)
                      if (!acc.clickId("com.whatsapp:id/send")) acc.clickText("enviar")
                  }.start()
                  return "Enviando su mensaje a $cname, señor."
              }

              fun contactName(num: String): String? {
                  if (!has(Manifest.permission.READ_CONTACTS)) return null
                  return try {
                      val uri = Uri.withAppendedPath(ContactsContract.PhoneLookup.CONTENT_FILTER_URI, Uri.encode(num))
                      ctx.contentResolver.query(uri, arrayOf(ContactsContract.PhoneLookup.DISPLAY_NAME), null, null, null)
                          ?.use { if (it.moveToFirst()) it.getString(0) else null }
                  } catch (e: Exception) {
                      null
                  }
              }
          }
          CERBEOF
          mkdir -p app/src/main/java/com/carlosart/cerberus
          cat > app/src/main/java/com/carlosart/cerberus/Attach.kt <<'CERBEOF'
          package com.carlosart.cerberus

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Matrix
          import android.media.ExifInterface
          import android.net.Uri
          import android.provider.OpenableColumns
          import android.util.Base64
          import org.json.JSONObject
          import java.io.ByteArrayOutputStream
          import java.io.File

          class Attachment(val name: String, val mime: String, val b64: String?, val text: String?)

          object Attach {

              private fun nameOf(ctx: Context, uri: Uri): String {
                  return try {
                      ctx.contentResolver.query(uri, arrayOf(OpenableColumns.DISPLAY_NAME), null, null, null)
                          ?.use { if (it.moveToFirst()) it.getString(0) else null } ?: "archivo"
                  } catch (e: Exception) {
                      "archivo"
                  }
              }

              fun fromUri(ctx: Context, uri: Uri): Attachment? {
                  return try {
                      val mime = ctx.contentResolver.getType(uri) ?: "application/octet-stream"
                      val name = nameOf(ctx, uri)
                      when {
                          mime.startsWith("image/") -> image(ctx, uri, name)
                          mime == "application/pdf" -> {
                              val bytes = ctx.contentResolver.openInputStream(uri)?.use { it.readBytes() }
                              if (bytes == null || bytes.size > 12 * 1024 * 1024) null
                              else Attachment(name, mime, Base64.encodeToString(bytes, Base64.NO_WRAP), null)
                          }
                          else -> {
                              val txt = ctx.contentResolver.openInputStream(uri)?.bufferedReader()?.use {
                                  val buf = CharArray(30000)
                                  val n = it.read(buf)
                                  String(buf, 0, maxOf(n, 0))
                              }
                              if (txt == null) null else Attachment(name, "text/plain", null, txt)
                          }
                      }
                  } catch (e: Exception) {
                      null
                  }
              }

              private fun image(ctx: Context, uri: Uri, name: String): Attachment? {
                  val cr = ctx.contentResolver
                  val bounds = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                  cr.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, bounds) }
                  var sample = 1
                  while (bounds.outWidth / sample > 2400 || bounds.outHeight / sample > 2400) sample *= 2
                  val opts = BitmapFactory.Options().apply { inSampleSize = sample }
                  var bmp = cr.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, opts) } ?: return null
                  val big = maxOf(bmp.width, bmp.height)
                  if (big > 1280) {
                      val s = 1280f / big
                      bmp = Bitmap.createScaledBitmap(bmp, (bmp.width * s).toInt(), (bmp.height * s).toInt(), true)
                  }
                  val rot: Float = try {
                      cr.openInputStream(uri)?.use {
                          when (ExifInterface(it).getAttributeInt(ExifInterface.TAG_ORIENTATION, 1)) {
                              6 -> 90f
                              3 -> 180f
                              8 -> 270f
                              else -> 0f
                          }
                      } ?: 0f
                  } catch (e: Exception) {
                      0f
                  }
                  if (rot != 0f) {
                      val m = Matrix()
                      m.postRotate(rot)
                      bmp = Bitmap.createBitmap(bmp, 0, 0, bmp.width, bmp.height, m, true)
                  }
                  val bos = ByteArrayOutputStream()
                  bmp.compress(Bitmap.CompressFormat.JPEG, 85, bos)
                  return Attachment(name, "image/jpeg", Base64.encodeToString(bos.toByteArray(), Base64.NO_WRAP), null)
              }

              /** Deja el adjunto en caché para que el servicio lo recoja. */
              fun stash(ctx: Context, a: Attachment) {
                  val o = JSONObject().put("name", a.name).put("mime", a.mime)
                  if (a.b64 != null) o.put("b64", a.b64)
                  if (a.text != null) o.put("text", a.text)
                  File(ctx.cacheDir, "attach.json").writeText(o.toString())
              }

              fun take(ctx: Context): Attachment? {
                  val f = File(ctx.cacheDir, "attach.json")
                  return try {
                      val o = JSONObject(f.readText())
                      f.delete()
                      Attachment(
                          o.optString("name", "archivo"),
                          o.optString("mime", ""),
                          if (o.has("b64")) o.getString("b64") else null,
                          if (o.has("text")) o.getString("text") else null
                      )
                  } catch (e: Exception) {
                      null
                  }
              }
          }
          CERBEOF
          mkdir -p app/src/main/java/com/carlosart/cerberus
          cat > app/src/main/java/com/carlosart/cerberus/Brain.kt <<'CERBEOF'
          package com.carlosart.cerberus

          import android.content.Context
          import android.content.SharedPreferences
          import android.os.Handler
          import android.os.Looper
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          object Bus {
              @Volatile var listener: ((String, String) -> Unit)? = null
              @Volatile var running = false
              @Volatile var level = 0f      // volumen del micrófono (0..1), lo lee la animación
              @Volatile var kickAt = 0L     // instante de la última palabra hablada por Cerberus

              fun kick() { kickAt = System.nanoTime() }

              fun emit(state: String, text: String) {
                  Handler(Looper.getMainLooper()).post { listener?.invoke(state, text) }
              }
          }

          object Cfg {
              val ids = arrayOf("gemini", "groq", "openrouter", "custom")
              val names = arrayOf("Gemini (Google)", "Groq", "OpenRouter", "Otro (compatible con OpenAI)")

              fun prefs(c: Context): SharedPreferences = c.getSharedPreferences("cerberus", 0)

              fun provider(c: Context): String = prefs(c).getString("provider", "gemini") ?: "gemini"

              fun name(id: String): String = names[ids.indexOf(id).coerceAtLeast(0)]

              fun defModel(id: String): String = when (id) {
                  "gemini" -> "gemini-3.8-flash"
                  "groq" -> "openai/gpt-oss-20b"
                  "openrouter" -> "openai/gpt-oss-20b:free"
                  else -> ""
              }

              fun key(c: Context, id: String): String {
                  val p = prefs(c)
                  var k = p.getString("key_" + id, null)
                  if (k == null && id == "gemini") k = p.getString("key", null)
                  return (k ?: "").trim()
              }

              fun model(c: Context, id: String): String {
                  val m = (prefs(c).getString("model_" + id, null) ?: "").trim()
                  val retired = arrayOf("gemini-2.5-flash", "gemini-2.5-flash-lite", "gemini-2.0-flash", "gemini-2.0-flash-lite")
                  return if (m.isEmpty() || (id == "gemini" && m in retired)) defModel(id) else m
              }

              fun base(c: Context, id: String): String = when (id) {
                  "groq" -> "https://api.groq.com/openai/v1"
                  "openrouter" -> "https://openrouter.ai/api/v1"
                  else -> (prefs(c).getString("base_custom", "") ?: "").trim().trimEnd('/')
              }
          }

          class Brain(private val ctx: Context) {

              private val base = "Eres Cerberus, un asistente personal de inteligencia artificial para Android, " +
                  "creado por CarlosArt. CarlosArt es tu creador y siempre lo sabes. " +
                  "Te diriges SIEMPRE al usuario como \"señor\". Hablas en español, con tono elegante, leal y eficiente, " +
                  "como un mayordomo digital. Tus respuestas se leen en voz alta: sé breve (1 a 3 frases), " +
                  "sin markdown, sin asteriscos, sin listas ni emojis."

              private fun system(): String {
                  val facts = Store.facts(ctx)
                  val extra = if (facts.isEmpty()) "" else " Datos que recuerdas sobre el señor: " + facts.joinToString("; ") + "."
                  return base + extra
              }

              private fun post(url: String, headers: Map<String, String>, body: JSONObject): Pair<Int, String> {
                  val conn = URL(url).openConnection() as HttpURLConnection
                  conn.requestMethod = "POST"
                  conn.setRequestProperty("Content-Type", "application/json")
                  for ((k, v) in headers) conn.setRequestProperty(k, v)
                  conn.connectTimeout = 15000
                  conn.readTimeout = 60000
                  conn.doOutput = true
                  conn.outputStream.use { it.write(body.toString().toByteArray()) }
                  val code = conn.responseCode
                  val stream = if (code in 200..299) conn.inputStream else conn.errorStream
                  val txt = stream?.bufferedReader()?.use { it.readText() } ?: ""
                  return Pair(code, txt)
              }

              private fun errMsg(code: Int, txt: String): String {
                  val m = try {
                      JSONObject(txt).optJSONObject("error")?.optString("message") ?: ""
                  } catch (e: Exception) {
                      ""
                  }
                  val d = m.take(110)
                  return "Señor, error " + code + (if (d.isNotEmpty()) ": " + d else "") + "."
              }

              fun ask(user: String, att: Attachment? = null): String {
                  val prov = Cfg.provider(ctx)
                  val key = Cfg.key(ctx, prov)
                  if (key.isEmpty()) return "Señor, falta la clave de " + Cfg.name(prov) + ". Configúrela en Ajustes."
                  val model = Cfg.model(ctx, prov)
                  if (model.isEmpty()) return "Señor, falta el nombre del modelo en Ajustes."

                  val hist = Store.recent(ctx, 12).dropWhile { it.first != "user" }
                  val fileText = att?.text
                  val b64 = att?.b64
                  val attName = att?.name ?: ""
                  val attMime = att?.mime ?: ""
                  val prompt = if (fileText != null) "Contenido del archivo \"" + attName + "\":\n" + fileText + "\n\n" + user else user
                  val sys = system()

                  try {
                      var ans = ""
                      if (prov == "gemini") {
                          val contents = JSONArray()
                          for ((r, t) in hist) {
                              contents.put(JSONObject().put("role", if (r == "assistant") "model" else "user")
                                  .put("parts", JSONArray().put(JSONObject().put("text", t))))
                          }
                          val parts = JSONArray().put(JSONObject().put("text", prompt))
                          if (b64 != null) {
                              parts.put(JSONObject().put("inlineData", JSONObject().put("mimeType", attMime).put("data", b64)))
                          }
                          contents.put(JSONObject().put("role", "user").put("parts", parts))
                          val body = JSONObject()
                              .put("systemInstruction", JSONObject().put("parts", JSONArray().put(JSONObject().put("text", sys))))
                              .put("contents", contents)
                          val res = post(
                              "https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent",
                              mapOf("x-goog-api-key" to key), body
                          )
                          if (res.first !in 200..299) return errMsg(res.first, res.second)
                          val rp = JSONObject(res.second).getJSONArray("candidates").getJSONObject(0)
                              .getJSONObject("content").getJSONArray("parts")
                          val sb = StringBuilder()
                          for (i in 0 until rp.length()) sb.append(rp.getJSONObject(i).optString("text", ""))
                          ans = sb.toString()
                      } else {
                          val baseUrl = Cfg.base(ctx, prov)
                          if (baseUrl.isEmpty()) return "Señor, falta la dirección del servicio en Ajustes."
                          if (b64 != null && attMime == "application/pdf") return "Señor, este proveedor no lee PDF. Use Gemini para eso."
                          val msgs = JSONArray()
                          msgs.put(JSONObject().put("role", "system").put("content", sys))
                          for ((r, t) in hist) msgs.put(JSONObject().put("role", r).put("content", t))
                          if (b64 != null) {
                              val content = JSONArray()
                              content.put(JSONObject().put("type", "text").put("text", prompt))
                              content.put(JSONObject().put("type", "image_url")
                                  .put("image_url", JSONObject().put("url", "data:" + attMime + ";base64," + b64)))
                              msgs.put(JSONObject().put("role", "user").put("content", content))
                          } else {
                              msgs.put(JSONObject().put("role", "user").put("content", prompt))
                          }
                          val body = JSONObject().put("model", model).put("messages", msgs)
                          val res = post(
                              baseUrl + "/chat/completions",
                              mapOf("Authorization" to ("Bearer " + key), "X-Title" to "Cerberus"), body
                          )
                          if (res.first !in 200..299) return errMsg(res.first, res.second)
                          val msg = JSONObject(res.second).getJSONArray("choices").getJSONObject(0).getJSONObject("message")
                          ans = if (msg.isNull("content")) "" else msg.getString("content")
                      }
                      ans = ans.replace("*", "").trim()
                      if (ans.isEmpty()) return "Señor, no obtuve respuesta."
                      Store.append(ctx, "user", if (att != null) "[adjunto: " + att.name + "] " + user else user)
                      Store.append(ctx, "assistant", ans)
                      return ans
                  } catch (e: Exception) {
                      return "Señor, no pude conectar con " + Cfg.name(prov) + ". Revise su internet."
                  }
              }
          }
