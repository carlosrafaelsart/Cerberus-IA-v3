              }

              private fun post(url: String, headers: Map<String, String>, body: JSONObject): Pair<Int, String> {
                  val conn = URL(url).openConnection() as HttpURLConnection
                  conn.requestMethod = "POST"
                  conn.setRequestProperty("Content-Type", "application/json")
                  for ((k, v) in headers) conn.setRequestProperty(k, v)
                  conn.connectTimeout = 15000
                  conn.readTimeout = 60000
                  conn.doOutput = true
                  conn.outputStream.use { it.write(body.toString().toByteArray()) }
                  val code = conn.responseCode
                  val stream = if (code in 200..299) conn.inputStream else conn.errorStream
                  val txt = stream?.bufferedReader()?.use { it.readText() } ?: ""
                  return Pair(code, txt)
              }

              private fun errMsg(code: Int, txt: String): String {
                  val m = try {
                      JSONObject(txt).optJSONObject("error")?.optString("message") ?: ""
                  } catch (e: Exception) {
                      ""
                  }
                  val d = m.take(110)
                  return "Señor, error " + code + (if (d.isNotEmpty()) ": " + d else "") + "."
              }

              /** Ejecuta una herramienta. Si pide confirmación devuelve la pregunta con prefijo \u0001. */
              private fun runTool(name: String, args: JSONObject, actions: Actions): String {
                  if (Tools.needsConfirm(name) && Cfg.confirmOn(ctx)) {
                      Tools.setPending(name, args)
                      return "\u0001" + Tools.question(name, args)
                  }
                  Bus.emit("thinking", if (name == "web_search") "Buscando en internet…" else "Ejecutando…")
                  return Tools.run(ctx, actions, name, args)
              }

              /** Mira una imagen (captura de pantalla) con el proveedor actual y la describe en texto. */
              fun vision(b64: String, question: String): String {
                  val prov = Cfg.provider(ctx)
                  val key = Cfg.key(ctx, prov)
                  val model = Cfg.model(ctx, prov)
                  if (key.isEmpty() || model.isEmpty()) return "Falta configurar el proveedor de IA."
                  val q = question + " Responde en español, breve. Para cada botón o icono relevante da su posición como porcentaje " +
                      "del ancho y del alto de la imagen, con el formato nombre(x%,y%)."
                  return try {
                      if (prov == "gemini") {
                          val parts = JSONArray().put(JSONObject().put("text", q))
                              .put(JSONObject().put("inlineData", JSONObject().put("mimeType", "image/jpeg").put("data", b64)))
                          val body = JSONObject().put("contents", JSONArray().put(JSONObject().put("role", "user").put("parts", parts)))
                          val res = post("https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent",
                              mapOf("x-goog-api-key" to key), body)
                          if (res.first !in 200..299) return errMsg(res.first, res.second)
                          val rp = JSONObject(res.second).getJSONArray("candidates").getJSONObject(0)
                              .getJSONObject("content").getJSONArray("parts")
                          val sb = StringBuilder()
                          for (i in 0 until rp.length()) sb.append(rp.getJSONObject(i).optString("text", ""))
                          sb.toString().trim()
                      } else {
                          val baseUrl = Cfg.base(ctx, prov)
                          val content = JSONArray().put(JSONObject().put("type", "text").put("text", q))
                              .put(JSONObject().put("type", "image_url").put("image_url", JSONObject().put("url", "data:image/jpeg;base64," + b64)))
                          val body = JSONObject().put("model", model)
                              .put("messages", JSONArray().put(JSONObject().put("role", "user").put("content", content)))
                          val res = post(baseUrl + "/chat/completions",
                              mapOf("Authorization" to ("Bearer " + key), "X-Title" to "Cerberus"), body)
                          if (res.first !in 200..299) return errMsg(res.first, res.second)
                          val msg = JSONObject(res.second).getJSONArray("choices").getJSONObject(0).getJSONObject("message")
                          (if (msg.isNull("content")) "" else msg.getString("content")).trim()
                      }
                  } catch (e: Exception) {
                      "No pude analizar la captura."
                  }
              }

              fun ask(user: String, att: Attachment? = null, mode: String = ""): String {
                  val prov = Cfg.provider(ctx)
                  val key = Cfg.key(ctx, prov)
                  if (key.isEmpty()) return "Señor, falta la clave de " + Cfg.name(prov) + ". Configúrela en Ajustes."
                  val model = Cfg.model(ctx, prov)
                  if (model.isEmpty()) return "Señor, falta el nombre del modelo en Ajustes."

                  val hist = Store.recent(ctx, 12).dropWhile { it.first != "user" }
                  val fileText = att?.text
                  val b64 = att?.b64
                  val attName = att?.name ?: ""
                  val attMime = att?.mime ?: ""
                  val prompt = if (fileText != null) "Contenido del archivo \"" + attName + "\":\n" + fileText + "\n\n" + user else user
                  val sys = system(mode)
                  val web = Cfg.webOn(ctx)
                  val actions = Actions(ctx)

                  try {
                      var ans = ""
                      var rounds = 0
                      if (prov == "gemini") {
                          val contents = JSONArray()
                          for ((r, t) in hist) {
                              contents.put(JSONObject().put("role", if (r == "assistant") "model" else "user")
                                  .put("parts", JSONArray().put(JSONObject().put("text", t))))
                          }
                          val parts = JSONArray().put(JSONObject().put("text", prompt))
                          if (b64 != null) {
                              parts.put(JSONObject().put("inlineData", JSONObject().put("mimeType", attMime).put("data", b64)))
                          }
                          contents.put(JSONObject().put("role", "user").put("parts", parts))
                          val url = "https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent"
                          var tools = mode.isEmpty() || mode == "chat" || mode == "info"
                          Bus.emit("thinking", "Pensando…")
                          while (true) {
                              val body = JSONObject()
                                  .put("systemInstruction", JSONObject().put("parts", JSONArray().put(JSONObject().put("text", if (tools) sys else sys + noTools))))
                                  .put("contents", contents)
                              if (tools) body.put("tools", Tools.gemini(web))
                              val res = post(url, mapOf("x-goog-api-key" to key), body)
                              if (res.first !in 200..299) {
                                  if (tools && rounds == 0 && res.first in 400..404) { tools = false; continue }
                                  return errMsg(res.first, res.second)
                              }
                              val cand = JSONObject(res.second).getJSONArray("candidates").getJSONObject(0)
                              val content = cand.optJSONObject("content") ?: return "Señor, no obtuve respuesta."
                              val rp = content.optJSONArray("parts") ?: JSONArray()
                              val calls = ArrayList<JSONObject>()
                              val sb = StringBuilder()
                              for (i in 0 until rp.length()) {
                                  val pt = rp.getJSONObject(i)
                                  val fc = pt.optJSONObject("functionCall")
                                  if (fc != null) calls.add(fc) else sb.append(pt.optString("text", ""))
                              }
                              if (!tools || calls.isEmpty() || rounds >= 7) { ans = sb.toString(); break }
                              content.put("role", "model")
                              contents.put(content)
                              val resp = JSONArray()
                              var pq: String? = null
                              for (fc in calls) {
                                  val nm = fc.optString("name")
                                  val r = runTool(nm, fc.optJSONObject("args") ?: JSONObject(), actions)
                                  if (r.startsWith("\u0001")) { pq = r.substring(1); break }
                                  resp.put(JSONObject().put("functionResponse",
                                      JSONObject().put("name", nm).put("response", JSONObject().put("result", r))))
                              }
                              if (pq != null) { ans = pq; break }
