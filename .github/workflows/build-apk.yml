                      }
                      "wave" -> {
                          p.strokeWidth = maxOf(2f * d, s * 0.1f)
                          val hs = floatArrayOf(0.25f, 0.55f, 0.9f, 0.5f, 0.7f, 0.3f)
                          for (i in hs.indices) {
                              val xx = x(0.08f + i * 0.168f)
                              cv.drawLine(xx, y(0.5f - hs[i] / 2f), xx, y(0.5f + hs[i] / 2f), p)
                          }
                      }
                      "close" -> {
                          cv.drawLine(x(0.15f), y(0.15f), x(0.85f), y(0.85f), p)
                          cv.drawLine(x(0.85f), y(0.15f), x(0.15f), y(0.85f), p)
                      }
                  }
              }
          }
