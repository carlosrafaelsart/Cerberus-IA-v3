          package com.carlosart.cerberus

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.view.View
          import kotlin.math.min

          /** Reloj pequeño dibujado a mano: abre el historial. */
          class ClockIcon(c: Context) : View(c) {

              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val d = c.resources.displayMetrics.density

              override fun onDraw(cv: Canvas) {
                  val cx = width / 2f
                  val cy = height / 2f
                  val r = min(cx, cy) - d * 1.5f
                  p.style = Paint.Style.STROKE
                  p.strokeCap = Paint.Cap.ROUND
                  p.strokeWidth = d * 2f
                  p.color = 0xFF2EC4FF.toInt()
                  cv.drawCircle(cx, cy, r, p)
                  cv.drawLine(cx, cy, cx, cy - r * 0.58f, p)
                  cv.drawLine(cx, cy, cx + r * 0.42f, cy + r * 0.12f, p)
              }
          }
