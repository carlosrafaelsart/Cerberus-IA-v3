                  "groq" -> "openai/gpt-oss-20b"
                  "openrouter" -> "openai/gpt-oss-20b:free"
                  else -> ""
              }

              fun key(c: Context, id: String): String {
                  val p = prefs(c)
                  var k = p.getString("key_" + id, null)
                  if (k == null && id == "gemini") k = p.getString("key", null)
                  return (k ?: "").trim()
              }

              fun model(c: Context, id: String): String {
                  val m = (prefs(c).getString("model_" + id, null) ?: "").trim()
                  val retired = arrayOf("gemini-2.5-flash", "gemini-2.5-flash-lite", "gemini-2.0-flash", "gemini-2.0-flash-lite")
                  return if (m.isEmpty() || (id == "gemini" && m in retired)) defModel(id) else m
              }

              fun base(c: Context, id: String): String = when (id) {
                  "groq" -> "https://api.groq.com/openai/v1"
                  "openrouter" -> "https://openrouter.ai/api/v1"
                  else -> (prefs(c).getString("base_custom", "") ?: "").trim().trimEnd('/')
              }
