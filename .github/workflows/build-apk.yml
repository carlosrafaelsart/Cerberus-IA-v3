          package com.carlosart.cerberus

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.text.InputType
          import android.view.Gravity
          import android.view.View
          import android.widget.AdapterView
          import android.widget.ArrayAdapter
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.Spinner
          import android.widget.TextView

          class SettingsActivity : Activity() {

              private lateinit var spinner: Spinner
              private lateinit var keyBox: EditText
              private lateinit var modelBox: EditText
              private lateinit var baseBox: EditText
              private lateinit var help: TextView
              private lateinit var testOut: TextView
              private var cur = ""

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun label(text: String): TextView {
                  val t = TextView(this)
                  t.text = text
                  t.textSize = 12f
                  t.letterSpacing = 0.12f
                  t.setTextColor(0xFF2EC4FF.toInt())
                  t.setPadding(0, dp(20), 0, dp(4))
                  return t
              }

              private fun styled(text: String, onClick: () -> Unit): Button {
                  val b = Button(this)
                  b.text = text
                  b.setTextColor(0xFFE8F6FF.toInt())
                  b.setBackgroundColor(0xFF0E2A3F.toInt())
                  b.setOnClickListener { onClick() }
                  val lp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(52))
                  lp.topMargin = dp(10)
                  b.layoutParams = lp
                  return b
              }

              private fun field(hint: String, password: Boolean): EditText {
                  val e = EditText(this)
                  e.hint = hint
                  e.setTextColor(0xFFE8F6FF.toInt())
                  e.setHintTextColor(0xFF5C7A90.toInt())
                  e.setSingleLine(true)
                  e.inputType = if (password) InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                  else InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_URI
                  return e
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = 0xFF050A14.toInt()
                  window.navigationBarColor = 0xFF050A14.toInt()

                  val col = LinearLayout(this)
                  col.orientation = LinearLayout.VERTICAL
                  col.setPadding(dp(20), dp(8), dp(20), dp(32))

                  val back = TextView(this)
                  back.text = "←  Volver"
                  back.textSize = 16f
                  back.setTextColor(0xFF2EC4FF.toInt())
                  back.setPadding(0, dp(12), dp(12), dp(12))
                  back.setOnClickListener { finish() }
                  col.addView(back)

                  val title = TextView(this)
                  title.text = "AJUSTES"
                  title.textSize = 26f
                  title.letterSpacing = 0.3f
                  title.setTextColor(0xFFE8F6FF.toInt())
                  title.gravity = Gravity.START
                  col.addView(title)

                  col.addView(label("CEREBRO (PROVEEDOR DE IA)"))
                  spinner = Spinner(this)
                  val ad = ArrayAdapter<String>(this, android.R.layout.simple_spinner_item, Cfg.names)
                  ad.setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item)
                  spinner.adapter = ad
                  col.addView(spinner)

                  help = TextView(this)
                  help.textSize = 12f
                  help.setTextColor(0xFF8DA5B6.toInt())
                  col.addView(help)

                  col.addView(label("CLAVE API"))
                  keyBox = field("Pegue aquí su clave", true)
                  col.addView(keyBox)

                  col.addView(label("MODELO"))
                  modelBox = field("Nombre del modelo", false)
                  col.addView(modelBox)

                  col.addView(label("DIRECCIÓN DEL SERVICIO"))
                  baseBox = field("https://api.openai.com/v1", false)
                  baseBox.visibility = View.GONE
                  col.addView(baseBox)

                  col.addView(styled("Probar conexión") {
                      saveFields(cur)
                      testOut.text = "Probando…"
                      val app = applicationContext
                      Thread {
                          val r = Brain(app).ask("Responde solo con: conexión lista.")
                          runOnUiThread { testOut.text = r }
                      }.start()
                  })
                  testOut = TextView(this)
                  testOut.textSize = 14f
                  testOut.setTextColor(0xFFB8CCDA.toInt())
                  testOut.setPadding(0, dp(8), 0, 0)
                  col.addView(testOut)

                  col.addView(label("PERMISOS"))
                  col.addView(styled("1 · Dar permisos") { askPermissions() })
                  col.addView(styled("2 · Permitir abrir apps en segundo plano") {
                      if (!Settings.canDrawOverlays(this)) {
                          startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      } else {
                          testOut.text = "Ya está permitido, señor."
                      }
                  })
                  col.addView(styled("3 · Quitar ahorro de batería") {
                      startActivity(Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:$packageName")))
                  })
                  col.addView(styled("4 · Activar accesibilidad (tocar, escribir, WhatsApp)") {
                      testOut.text = "Busque Cerberus en la lista y actívelo, señor."
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  })

                  val sv = ScrollView(this)
                  sv.setBackgroundColor(0xFF050A14.toInt())
                  sv.addView(col)
                  setContentView(sv)

                  spinner.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(parent: AdapterView<*>?, v: View?, pos: Int, id: Long) {
                          if (cur.isNotEmpty()) saveFields(cur)
                          cur = Cfg.ids[pos]
                          loadFields(cur)
                      }

                      override fun onNothingSelected(parent: AdapterView<*>?) {}
                  }
                  spinner.setSelection(Cfg.ids.indexOf(Cfg.provider(this)).coerceAtLeast(0))
              }

              private fun loadFields(id: String) {
                  keyBox.setText(Cfg.key(this, id))
                  modelBox.setText(Cfg.model(this, id))
                  baseBox.setText(Cfg.base(this, "custom"))
                  baseBox.visibility = if (id == "custom") View.VISIBLE else View.GONE
                  help.text = when (id) {
                      "gemini" -> "Clave gratis en aistudio.google.com/apikey (empieza con AIza)."
                      "groq" -> "Clave gratis en console.groq.com/keys (empieza con gsk_)."
                      "openrouter" -> "Clave en openrouter.ai/keys. Los modelos que terminan en :free no cuestan."
                      else -> "Cualquier servicio compatible con OpenAI: escriba su dirección base, clave y modelo."
                  }
                  testOut.text = ""
              }

              private fun saveFields(id: String) {
                  val e = Cfg.prefs(this).edit()
                  e.putString("key_" + id, keyBox.text.toString().trim())
                  e.putString("model_" + id, modelBox.text.toString().trim())
                  if (id == "custom") e.putString("base_custom", baseBox.text.toString().trim())
                  e.putString("provider", id)
                  e.apply()
              }

              override fun onPause() {
                  if (cur.isNotEmpty()) saveFields(cur)
                  super.onPause()
              }

              private fun askPermissions() {
                  val list = arrayListOf(
                      Manifest.permission.RECORD_AUDIO,
                      Manifest.permission.CALL_PHONE,
                      Manifest.permission.READ_CONTACTS,
                      Manifest.permission.ANSWER_PHONE_CALLS,
                      Manifest.permission.READ_PHONE_STATE,
                      Manifest.permission.READ_CALL_LOG
                  )
                  if (Build.VERSION.SDK_INT >= 33) list.add(Manifest.permission.POST_NOTIFICATIONS)
                  requestPermissions(list.toTypedArray(), 7)
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  testOut.text = "Permisos procesados, señor."
              }
          }
          CERBEOF

      - name: Compilar APK
        run: gradle assembleDebug --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Cerberus-APK
          path: app/build/outputs/apk/debug/app-debug.apk
