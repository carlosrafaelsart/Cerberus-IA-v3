          package com.carlosart.cerberus

          import android.animation.ValueAnimator
          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.view.View
          import kotlin.math.cos
          import kotlin.math.exp
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.roundToInt
          import kotlin.math.sin
          import kotlin.random.Random

          /**
           * Red neuronal en anillos concéntricos que giran lentamente en sentidos opuestos.
           * Los impulsos nacen en el anillo interior y viajan hacia afuera.
           * - Hablando: cada palabra de Cerberus lanza una ráfaga.
           * - Escuchando: la intensidad sigue el volumen de su voz.
           * - Pensando: actividad rápida y constante en ámbar.
           */
          class NeuralView(c: Context) : View(c) {

              var state: String = "idle"

              private val counts = intArrayOf(16, 24, 32, 42, 54, 66)
              private val fracs = floatArrayOf(0.26f, 0.38f, 0.50f, 0.64f, 0.79f, 0.94f)
              private val rings = counts.size
              private val n = counts.sum()
              private val ringStart = IntArray(rings)
              private val ringOf = IntArray(n)
              private val idxOf = IntArray(n)
              private val scale = FloatArray(n)
              private val ang = FloatArray(rings)
              private val ea = ArrayList<Int>()
              private val eb = ArrayList<Int>()
              private val from = Array(n) { ArrayList<Int>() }
              private val inputEdges = ArrayList<Int>()
              private val px = FloatArray(n)
              private val py = FloatArray(n)
              private val glow = FloatArray(n)
              private val nodeCol = IntArray(n)
              private val hsv = FloatArray(3)

              private class Pulse(var e: Int, var p: Float, var sp: Float)

              private val pulses = ArrayList<Pulse>()
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val dens = c.resources.displayMetrics.density
              private var last = 0L
              private var tt = 0f
              private var energy = 0.1f
              private var spawnAcc = 0f
              private var lastKick = 0L

              private val anim = ValueAnimator.ofFloat(0f, 1f).apply {
                  duration = 1000
                  repeatCount = ValueAnimator.INFINITE
                  addUpdateListener { step(); invalidate() }
              }

              private fun addEdge(a: Int, b: Int): Int {
                  ea.add(a)
                  eb.add(b)
                  from[a].add(ea.size - 1)
                  return ea.size - 1
              }

              init {
                  var k = 0
                  for (r in 0 until rings) {
                      ringStart[r] = k
                      for (i in 0 until counts[r]) {
                          ringOf[k] = r
                          idxOf[k] = i
                          scale[k] = 0.7f + Random.nextFloat() * 0.8f
                          k++
                      }
                      ang[r] = r * 0.7f
                  }
                  for (r in 0 until rings) {
                      val cnt = counts[r]
                      for (i in 0 until cnt) {
                          val a = ringStart[r] + i
                          addEdge(a, ringStart[r] + (i + 1) % cnt)
                          if (r < rings - 1) {
                              val nc = counts[r + 1]
                              val j = (i * nc / cnt.toFloat()).roundToInt()
                              val e1 = addEdge(a, ringStart[r + 1] + j % nc)
                              val e2 = addEdge(a, ringStart[r + 1] + (j + 1) % nc)
                              if (r == 0) {
                                  inputEdges.add(e1)
                                  inputEdges.add(e2)
                              }
                          }
                      }
                  }
              }

              override fun onAttachedToWindow() { super.onAttachedToWindow(); last = 0L; anim.start() }
              override fun onDetachedFromWindow() { anim.cancel(); super.onDetachedFromWindow() }

              private fun speed(): Float = 0.9f + energy * 2.0f + Random.nextFloat() * 0.6f

              private fun spawn() {
                  if (pulses.size >= 200) return
                  val e = inputEdges[Random.nextInt(inputEdges.size)]
                  glow[ea[e]] = 0.9f
                  pulses.add(Pulse(e, 0f, speed()))
              }

              private fun step() {
                  val now = System.nanoTime()
                  val dt = if (last == 0L) 0.016f else ((now - last) / 1e9f).coerceIn(0f, 0.05f)
                  last = now
                  tt += dt

                  val kickE = if (Bus.kickAt == 0L) 0f else exp(-((now - Bus.kickAt) / 1e9f) * 7f)
                  energy = when (state) {
                      "speaking" -> max(0.35f + 0.12f * sin(tt * 9f), 0.3f + 0.7f * kickE)
                      "thinking" -> 0.75f
                      "listening" -> 0.18f + 0.8f * Bus.level
                      else -> 0.1f
                  }
                  if (Bus.kickAt != lastKick) {
                      lastKick = Bus.kickAt
                      if (state == "speaking") repeat(6) { spawn() }
                  }

                  for (r in 0 until rings) {
                      val dir = if (r % 2 == 0) 1f else -1f
                      ang[r] += dir * (0.06f + 0.025f * r) * (1f + 2.5f * energy) * dt
                  }
                  for (i in 0 until n) glow[i] = max(0f, glow[i] - dt * 2.0f)

                  spawnAcc += energy * 34f * dt
                  while (spawnAcc >= 1f) {
                      spawnAcc -= 1f
                      spawn()
                  }

                  val born = ArrayList<Pulse>()
                  val iter = pulses.iterator()
                  while (iter.hasNext()) {
                      val p = iter.next()
                      p.p += p.sp * dt
                      if (p.p >= 1f) {
                          val b = eb[p.e]
                          glow[b] = 1f
                          iter.remove()
                          val out = from[b]
                          if (out.isNotEmpty() && pulses.size + born.size < 200 &&
                              Random.nextFloat() < 0.55f + 0.4f * energy
                          ) {
                              born.add(Pulse(out[Random.nextInt(out.size)], 0f, speed()))
                          }
                      }
                  }
                  pulses.addAll(born)
              }

              /** Matiz RGB de cada neurona: recorre el arcoíris y gira despacio; al pensar se limita a tonos cálidos. */
              private fun hueColor(k: Int): Int {
                  val r = ringOf[k]
                  var h = (360f * idxOf[k] / counts[r] + r * 47f + tt * 24f) % 360f
                  if (state == "thinking") h = 20f + h / 360f * 40f
                  hsv[0] = h
                  hsv[1] = 0.72f
                  hsv[2] = 1f
                  return android.graphics.Color.HSVToColor(hsv)
              }

              private fun alpha(c: Int, a: Int) = (a.coerceIn(0, 255) shl 24) or (c and 0xFFFFFF)

              override fun onDraw(cv: Canvas) {
                  val col = when (state) {
                      "thinking" -> 0xFFFFB347.toInt()
                      "speaking" -> 0xFF7DF9FF.toInt()
                      else -> 0xFF2EC4FF.toInt()
                  }
                  val core = if (state == "thinking") 0xFFFFEBCF.toInt() else 0xFFEAFFFF.toInt()
                  val cx = width / 2f
                  val cy = height / 2f
                  val big = min(cx, cy) - dens * 6f

                  for (k in 0 until n) {
                      val r = ringOf[k]
                      val a = ang[r] + 2f * Math.PI.toFloat() * idxOf[k] / counts[r]
                      val rad = big * fracs[r] * (1f + 0.025f * sin(tt * 1.2f + k) + 0.03f * energy)
                      px[k] = cx + rad * cos(a)
                      py[k] = cy + rad * sin(a)
                      nodeCol[k] = hueColor(k)
                  }

                  // brillo suave en el centro vacío
                  paint.style = Paint.Style.FILL
                  for (i in 0 until 6) {
                      paint.color = alpha(col, (5 + 22 * energy).toInt())
                      cv.drawCircle(cx, cy, big * 0.27f * (1f - i / 6f), paint)
                  }

                  paint.style = Paint.Style.STROKE
                  paint.strokeWidth = dens * 0.8f
                  for (e in ea.indices) {
                      val a = ea[e]
                      val b = eb[e]
                      val sameRing = ringOf[a] == ringOf[b]
                      paint.color = alpha(nodeCol[a], ((if (sameRing) 40 else 56) + 70 * energy).toInt())
                      cv.drawLine(px[a], py[a], px[b], py[b], paint)
                  }

                  paint.style = Paint.Style.FILL
                  for (p in pulses) {
                      val a = ea[p.e]
                      val b = eb[p.e]
                      val x = px[a] + (px[b] - px[a]) * p.p
                      val y = py[a] + (py[b] - py[a]) * p.p
                      paint.color = alpha(nodeCol[a], 90)
                      cv.drawCircle(x, y, dens * 3.6f, paint)
                      paint.color = alpha(core, 255)
                      cv.drawCircle(x, y, dens * 1.4f, paint)
                  }

                  for (k in 0 until n) {
                      val f = fracs[ringOf[k]]
                      val g = glow[k]
                      val s = scale[k]
                      paint.color = alpha(nodeCol[k], (50 + 100 * g).toInt())
                      cv.drawCircle(px[k], py[k], dens * (s * (1.5f + 1.8f * f) + 4.5f * g), paint)
                      paint.color = alpha(nodeCol[k], (200 + 55 * g).toInt())
                      cv.drawCircle(px[k], py[k], dens * (s * (0.55f + 1.0f * f) + 1.4f * g), paint)
                  }
              }
          }
