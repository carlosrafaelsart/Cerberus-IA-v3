          package com.carlosart.cerberus

          import android.animation.ValueAnimator
          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.view.View
          import kotlin.math.cos
          import kotlin.math.exp
          import kotlin.math.max
          import kotlin.math.sin
          import kotlin.random.Random

          /**
           * Red neuronal animada. Las señales viajan de la capa de entrada a la de salida.
           * - Hablando: cada palabra de Cerberus lanza una ráfaga de impulsos.
           * - Escuchando: la intensidad sigue el volumen de su voz.
           * - Pensando: actividad rápida y constante en ámbar.
           */
          class NeuralView(c: Context) : View(c) {

              var state: String = "idle"

              private val layers = intArrayOf(3, 5, 6, 5, 3)
              private val n = layers.sum()
              private val layerOf = IntArray(n)
              private val idxIn = IntArray(n)
              private val ea = ArrayList<Int>()
              private val eb = ArrayList<Int>()
              private val from = Array(n) { ArrayList<Int>() }
              private val inputEdges = ArrayList<Int>()
              private val bx = FloatArray(n)
              private val by = FloatArray(n)
              private val px = FloatArray(n)
              private val py = FloatArray(n)
              private val glow = FloatArray(n)

              private class Pulse(var e: Int, var p: Float, var sp: Float)

              private val pulses = ArrayList<Pulse>()
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val dens = c.resources.displayMetrics.density
              private var last = 0L
              private var tt = 0f
              private var energy = 0.1f
              private var spawnAcc = 0f
              private var lastKick = 0L

              private val anim = ValueAnimator.ofFloat(0f, 1f).apply {
                  duration = 1000
                  repeatCount = ValueAnimator.INFINITE
                  addUpdateListener { step(); invalidate() }
              }

              init {
                  var k = 0
                  for (l in layers.indices) for (i in 0 until layers[l]) {
                      layerOf[k] = l
                      idxIn[k] = i
                      k++
                  }
                  var start = 0
                  for (l in 0 until layers.size - 1) {
                      val next = start + layers[l]
                      for (i in 0 until layers[l]) for (j in 0 until layers[l + 1]) {
                          val a = start + i
                          val b = next + j
                          ea.add(a)
                          eb.add(b)
                          from[a].add(ea.size - 1)
                          if (l == 0) inputEdges.add(ea.size - 1)
                      }
                      start = next
                  }
              }

              override fun onAttachedToWindow() { super.onAttachedToWindow(); last = 0L; anim.start() }
              override fun onDetachedFromWindow() { anim.cancel(); super.onDetachedFromWindow() }

              override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) {
                  super.onSizeChanged(w, h, ow, oh)
                  val padX = dens * 18f
                  val padY = dens * 16f
                  for (k in 0 until n) {
                      val l = layerOf[k]
                      bx[k] = padX + (w - 2f * padX) * l / (layers.size - 1f)
                      by[k] = padY + (h - 2f * padY) * (idxIn[k] + 1f) / (layers[l] + 1f)
                  }
              }

              private fun speed(): Float = 1.0f + energy * 2.2f + Random.nextFloat() * 0.6f

              private fun spawn() {
                  if (pulses.size >= 160) return
                  val e = inputEdges[Random.nextInt(inputEdges.size)]
                  glow[ea[e]] = 0.8f
                  pulses.add(Pulse(e, 0f, speed()))
              }

              private fun step() {
                  val now = System.nanoTime()
                  val dt = if (last == 0L) 0.016f else ((now - last) / 1e9f).coerceIn(0f, 0.05f)
                  last = now
                  tt += dt

                  val kickE = if (Bus.kickAt == 0L) 0f else exp(-((now - Bus.kickAt) / 1e9f) * 7f)
                  energy = when (state) {
                      "speaking" -> max(0.35f + 0.12f * sin(tt * 9f), 0.3f + 0.7f * kickE)
                      "thinking" -> 0.75f
                      "listening" -> 0.18f + 0.8f * Bus.level
                      else -> 0.1f
                  }
                  if (Bus.kickAt != lastKick) {
                      lastKick = Bus.kickAt
                      if (state == "speaking") repeat(5) { spawn() }
                  }

                  for (i in 0 until n) glow[i] = max(0f, glow[i] - dt * 2.2f)

                  spawnAcc += energy * 36f * dt
                  while (spawnAcc >= 1f) {
                      spawnAcc -= 1f
                      spawn()
                  }

                  val born = ArrayList<Pulse>()
                  val iter = pulses.iterator()
                  while (iter.hasNext()) {
                      val p = iter.next()
                      p.p += p.sp * dt
                      if (p.p >= 1f) {
                          val b = eb[p.e]
                          glow[b] = 1f
                          iter.remove()
                          val out = from[b]
                          if (out.isNotEmpty() && pulses.size + born.size < 160 &&
                              Random.nextFloat() < 0.5f + 0.4f * energy
                          ) {
                              born.add(Pulse(out[Random.nextInt(out.size)], 0f, speed()))
                          }
                      }
                  }
                  pulses.addAll(born)
              }

              private fun alpha(c: Int, a: Int) = (a.coerceIn(0, 255) shl 24) or (c and 0xFFFFFF)

              override fun onDraw(cv: Canvas) {
                  val col = when (state) {
                      "thinking" -> 0xFFFFB347.toInt()
                      "speaking" -> 0xFF7DF9FF.toInt()
                      else -> 0xFF2EC4FF.toInt()
                  }
                  val drift = dens * (2f + 5f * energy)
                  for (k in 0 until n) {
                      px[k] = bx[k] + drift * sin(tt * 0.9f + k * 1.7f)
                      py[k] = by[k] + drift * cos(tt * 0.7f + k * 2.3f)
                  }

                  paint.style = Paint.Style.STROKE
                  paint.strokeWidth = dens * 1f
                  paint.color = alpha(col, (28 + 60 * energy).toInt())
                  for (e in ea.indices) cv.drawLine(px[ea[e]], py[ea[e]], px[eb[e]], py[eb[e]], paint)

                  paint.style = Paint.Style.FILL
                  for (p in pulses) {
                      val a = ea[p.e]
                      val b = eb[p.e]
                      val x = px[a] + (px[b] - px[a]) * p.p
                      val y = py[a] + (py[b] - py[a]) * p.p
                      paint.color = alpha(col, 70)
                      cv.drawCircle(x, y, dens * 5f, paint)
                      paint.color = alpha(col, 255)
                      cv.drawCircle(x, y, dens * 2.2f, paint)
                  }

                  for (k in 0 until n) {
                      val g = glow[k]
                      paint.color = alpha(col, (50 * g).toInt())
                      cv.drawCircle(px[k], py[k], dens * (7f + 9f * g), paint)
                      paint.color = alpha(col, (110 + 145 * g).toInt())
                      cv.drawCircle(px[k], py[k], dens * (3.5f + 3f * g), paint)
                  }
              }
          }
