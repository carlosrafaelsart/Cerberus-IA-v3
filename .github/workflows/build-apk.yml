              private fun appVersion(): String = try {
                  packageManager.getPackageInfo(packageName, 0).versionName ?: ""
              } catch (e: Exception) {
                  ""
              }

              private fun setDrawer(open: Boolean) {
                  drawerOpen = open
                  val pw = panel.width.takeIf { it > 0 } ?: (resources.displayMetrics.widthPixels * 0.8f).toInt()
                  if (open) {
                      scrim.alpha = 0f
                      scrim.visibility = View.VISIBLE
                      scrim.animate().alpha(1f).setDuration(180).start()
                      panel.animate().translationX(0f).setDuration(200).start()
                  } else {
                      scrim.animate().alpha(0f).setDuration(160).withEndAction { scrim.visibility = View.GONE }.start()
                      panel.animate().translationX(-pw.toFloat()).setDuration(180).start()
                  }
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (drawerOpen) setDrawer(false) else super.onBackPressed()
              }

              private fun isOnline(): Boolean {
                  return try {
                      val cm = getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                      val n = cm.activeNetwork ?: return false
                      cm.getNetworkCapabilities(n)?.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET) == true
                  } catch (e: Exception) {
                      true
                  }
              }

              private fun refreshOnline() {
                  val prov = Cfg.provider(this)
                  if (Cfg.key(this, prov).isEmpty()) {
                      online.text = "●\nSin clave"
                      online.setTextColor(0xFFFFB347.toInt())
                  } else if (!isOnline()) {
                      online.text = "●\nSin internet"
                      online.setTextColor(0xFFFFB347.toInt())
                  } else {
                      online.text = "●\nEn línea"
                      online.setTextColor(Neon.GREEN)
                  }
              }

              override fun onResume() {
                  super.onResume()
                  Bus.listener = { state, text ->
                      neural.state = state
                      if (text.isNotEmpty()) status.text = text
                  }
                  val prov = Cfg.provider(this)
                  if (Cfg.key(this, prov).isEmpty() && !Bus.running) {
                      status.text = "Abra el menú → Configuración y ponga su clave, señor."
                  }
                  neural.state = if (Bus.running) "listening" else "idle"
                  refreshOnline()
                  refreshButton()
              }

              override fun onPause() {
                  Bus.listener = null
                  super.onPause()
              }

              private fun refreshButton() {
                  val on = Bus.running
                  micBg.setColor(if (on) Neon.CYAN else Neon.PANEL)
                  micIcon.setColor(if (on) 0xFF04131D.toInt() else Neon.CYAN)
              }

              private fun hasMic() =
                  checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED

              private fun toggleService() {
                  if (Bus.running) {
                      stopService(Intent(this, CerberusService::class.java))
                      Bus.running = false
                      neural.state = "idle"
                      status.text = "Cerberus desactivado."
                  } else {
                      if (!hasMic()) {
                          status.text = "Necesito permisos, señor. Acéptelos."
                          askPermissions()
                          return
                      }
                      startForegroundService(Intent(this, CerberusService::class.java))
                      Bus.running = true
                      status.text = "Escuchando… diga \"Cerberus\"."
                  }
                  refreshButton()
              }

              // ---------- escribirle a Cerberus ----------

              private fun sendText() {
                  val q = input.text.toString().trim()
                  if (q.isEmpty()) return
                  input.setText("")
                  try {
                      (getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager)
                          .hideSoftInputFromWindow(input.windowToken, 0)
                  } catch (e: Exception) { }
                  status.text = q
                  neural.state = "thinking"
                  if (Bus.running) {
                      val i = Intent(this, CerberusService::class.java)
                      i.action = "ASK_TEXT"
                      i.putExtra("text", q)
                      startService(i)
                  } else {
                      val app = applicationContext
                      Thread {
                          val ans = Actions(app).tryHandle(q) ?: Brain(app).ask(q)
                          runOnUiThread {
                              neural.state = "idle"
                              status.text = ans
                          }
                      }.start()
                  }
              }

              // ---------- fotos, cámara y archivos ----------

              private fun showPlusMenu() {
                  AlertDialog.Builder(this)
                      .setItems(arrayOf("Foto de la galería", "Tomar foto con la cámara", "Archivo (PDF, texto…)")) { _, which ->
                          when (which) {
                              0 -> pick("image/*", 11)
                              1 -> camera()
                              else -> pick("*/*", 12)
                          }
                      }
                      .show()
              }

              private fun pick(mime: String, code: Int) {
                  val i = Intent(Intent.ACTION_GET_CONTENT)
                  i.type = mime
                  i.addCategory(Intent.CATEGORY_OPENABLE)
                  startActivityForResult(i, code)
              }

              private fun camera() {
                  try {
                      val v = ContentValues()
                      v.put(MediaStore.Images.Media.DISPLAY_NAME, "cerberus_" + System.currentTimeMillis() + ".jpg")
                      v.put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg")
                      if (Build.VERSION.SDK_INT >= 29) v.put(MediaStore.Images.Media.RELATIVE_PATH, "Pictures/Cerberus")
                      camUri = contentResolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, v)
                      val i = Intent(MediaStore.ACTION_IMAGE_CAPTURE)
                      i.putExtra(MediaStore.EXTRA_OUTPUT, camUri)
                      startActivityForResult(i, 13)
                  } catch (e: Exception) {
                      status.text = "No pude abrir la cámara, señor."
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (resultCode != RESULT_OK) return
                  val uri = if (requestCode == 13) camUri else data?.data
                  if (uri != null) askAbout(uri)
              }

              private fun askAbout(uri: Uri) {
                  val box = EditText(this)
                  box.hint = "¿Qué desea saber? (vacío = describir)"
                  box.setSingleLine(true)
                  AlertDialog.Builder(this)
                      .setTitle("Enviar a Cerberus")
                      .setView(box)
                      .setNegativeButton("Cancelar", null)
                      .setPositiveButton("Enviar") { _, _ ->
                          sendAttachment(uri, box.text.toString().trim().ifEmpty { "Describe esto con detalle breve." })
                      }
                      .show()
              }

              private fun sendAttachment(uri: Uri, prompt: String) {
                  if (!hasMic()) {
                      status.text = "Primero necesito permisos, señor."
                      askPermissions()
                      return
                  }
                  status.text = "Leyendo el archivo…"
                  neural.state = "thinking"
                  Thread {
                      val att = Attach.fromUri(this, uri)
                      runOnUiThread {
                          if (att == null) {
                              neural.state = "idle"
                              status.text = "No pude leer ese archivo, señor."
                          } else {
                              Attach.stash(this, att)
                              val i = Intent(this, CerberusService::class.java)
                              i.action = "ASK_ATTACH"
                              i.putExtra("prompt", prompt)
                              startForegroundService(i)
                              Bus.running = true
                              refreshButton()
                          }
                      }
                  }.start()
              }

              // ---------- permisos ----------

              private fun askPermissions() {
                  val list = arrayListOf(
                      Manifest.permission.RECORD_AUDIO,
                      Manifest.permission.CALL_PHONE,
                      Manifest.permission.READ_CONTACTS,
                      Manifest.permission.ANSWER_PHONE_CALLS,
                      Manifest.permission.READ_PHONE_STATE,
                      Manifest.permission.READ_CALL_LOG
                  )
                  if (Build.VERSION.SDK_INT >= 33) list.add(Manifest.permission.POST_NOTIFICATIONS)
                  requestPermissions(list.toTypedArray(), 7)
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  status.text = "Permisos procesados. Ya puede activar a Cerberus, señor."
              }
          }
